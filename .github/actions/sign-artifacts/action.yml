name: Sign artifacts
description: >
  Detached minisign signatures over every artifact of a release, each one then verified
  against the public key the application itself compiles in.

# A composite action rather than a step copied into each platform's job. Every job that
# publishes has to sign, and the failure mode of two copies drifting apart is that one
# platform quietly ships unsigned — which nobody notices until a user's updater refuses
# an installer, long after the release.

inputs:
  secret-key:
    description: >
      The unencrypted minisign secret key, from the MINISIGN_SECRET_KEY repository
      secret. Never echoed, and deleted from the runner before the step ends.
    required: true
  directory:
    description: Directory whose files are signed. Signatures land beside them.
    required: false
    default: dist
  public-key:
    description: >
      The key to verify against. Defaults to the one compiled into the binary, which is
      the whole point of the check — see below.
    required: false
    default: assets/release-signing.pub

runs:
  using: composite
  steps:
    - name: Sign and verify
      shell: bash
      env:
        MINISIGN_SECRET_KEY: ${{ inputs.secret-key }}
        DIRECTORY: ${{ inputs.directory }}
        PUBLIC_KEY: ${{ inputs.public-key }}
      run: |
        set -euo pipefail

        if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
          echo "::error::MINISIGN_SECRET_KEY is not set. Releasing unsigned artifacts \
        would publish installers that k2g's own updater then refuses to run; see the \
        setup notes at the top of .github/workflows/release.yml."
          exit 1
        fi

        cargo install rsign2 --locked

        # --- get the secret into the shape rsign wants -------------------------------
        #
        # A minisign secret key is a *file* of two lines: an untrusted comment, then the
        # encoded key. A GitHub secret is a string, and there are three shapes people
        # reasonably end up storing it in — the file verbatim, the file base64-encoded
        # (the usual reflex for "a secret with newlines in it"), or just the payload line
        # with the comment dropped. The last two both fail with rsign's
        # "Missing encoded key in secret key", which says nothing about which mistake it
        # was, twenty minutes into a release.
        #
        # So each candidate is *tried* rather than sniffed: built, then tested by signing
        # a throwaway file. Whichever signs is the right reading. Nothing here echoes the
        # key or any part of it.
        printf '%s' "$MINISIGN_SECRET_KEY" > secret.raw
        printf 'probe' > probe.bin

        candidate_works() {
          rm -f probe.bin.minisig
          rsign sign -W -s "$1" -x probe.bin.minisig probe.bin >/dev/null 2>&1
        }

        # 1. The key file as it stands. A trailing newline is added because a secret
        #    pasted without one is otherwise a valid file that reads as truncated.
        { cat secret.raw; echo; } > candidate-verbatim.key
        # 2. base64 of the whole file.
        base64 -d < secret.raw > candidate-base64.key 2>/dev/null || : > candidate-base64.key
        # 3. The encoded line on its own — the comment is untrusted and unused, so any
        #    comment restores a usable file.
        { echo "untrusted comment: k2g release signing key"; cat secret.raw; echo; } \
          > candidate-bare.key

        shape=""
        for pair in "verbatim:the key file" \
                    "base64:the key file, base64-encoded" \
                    "bare:the encoded line without its comment"; do
          name="${pair%%:*}"
          if candidate_works "candidate-${name}.key"; then
            cp "candidate-${name}.key" minisign.key
            shape="${pair#*:}"
            break
          fi
        done

        rm -f secret.raw candidate-*.key probe.bin probe.bin.minisig

        if [ -z "$shape" ]; then
          echo "::error::MINISIGN_SECRET_KEY is set but is not a usable minisign secret \
        key in any of the shapes this understands (the key file, that file base64-encoded, \
        or its encoded line alone). Re-set it from the file itself: \
        gh secret set MINISIGN_SECRET_KEY --env release < k2g.key"
          exit 1
        fi
        echo "read the signing key as $shape"

        signed=0
        for artifact in "$DIRECTORY"/*; do
          case "$artifact" in *.minisig) continue;; esac
          [ -f "$artifact" ] || continue
          rsign sign -W -s minisign.key -x "${artifact}.minisig" "$artifact"

          # The half that matters, and the half that was missing. Signing proves the
          # workflow holds *a* key; this proves it holds *the* key — the public half of
          # which is compiled into every k2g build as `update::PUBLIC_KEY`. Get that
          # pairing wrong and each artifact is perfectly signed and universally
          # rejected, with the first report arriving from a user whose update failed.
          rsign verify -p "$PUBLIC_KEY" -x "${artifact}.minisig" "$artifact"
          echo "signed and verified $(basename "$artifact")"
          signed=$((signed + 1))
        done

        rm -f minisign.key

        # A release with nothing signed is a release with nothing in it. Better to fail
        # here than to publish an empty set of assets and a set of notes claiming they
        # are verifiable.
        if [ "$signed" -eq 0 ]; then
          echo "::error::no artifacts found in '$DIRECTORY' to sign"
          exit 1
        fi
        echo "$signed artifact(s) signed against $PUBLIC_KEY"
        ls -la "$DIRECTORY"
