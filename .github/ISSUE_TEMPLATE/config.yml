# Blank issues stay enabled: not every report fits a form, and a form that turns
# someone away is worse than an unstructured issue.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/adarwoo/k2g/security/advisories/new
    about: >
      Report privately as a draft advisory, not as a public issue. See SECURITY.md for
      scope and what to expect.

  - name: Question about using k2g
    url: https://github.com/adarwoo/k2g/blob/main/docs/user-manual.md
    about: >
      The manual covers setup, profiles, two-sided work and troubleshooting. It is also
      inside the application, under Manual — with a search field.

  - name: Installing, connecting to KiCad, or removing k2g
    url: https://github.com/adarwoo/k2g/blob/main/docs/install-and-security.md
    about: >
      Enabling the KiCad API, verifying a download, where your data lives, and uninstalling.
