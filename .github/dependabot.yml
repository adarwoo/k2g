version: 2

# Keeping dependencies current is the cheap half of EU CRA Annex I Part II (2),
# "address and remediate vulnerabilities without delay": most remediation is a
# version bump that someone else already wrote.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps arrive as one reviewable PR rather than a dozen.
      # Majors stay separate — those are the ones that need reading.
      routine:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
