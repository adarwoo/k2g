name: Audit

# EU CRA Annex I Part II (3): "apply effective and regular tests and reviews of the
# security of the product". Two complementary checks —
#
#   cargo audit  matches the dependency tree against the RUSTSEC advisory database,
#                which is the "identify vulnerabilities in the components" half of
#                Part II (1).
#   cargo deny   catches what an advisory feed cannot: unmaintained crates, licence
#                incompatibilities (k2g is GPL-3.0-only), and duplicate or yanked
#                versions.
#
# Scheduled as well as on-PR because the code not changing is exactly when a new
# advisory against an existing dependency goes unnoticed.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    runs-on: ubuntu-latest
    # `rustsec/audit-check` publishes its findings as a check run, and the default token
    # is read-only — so the job failed with "Resource not accessible by integration"
    # while reporting zero vulnerabilities. It was failing on the report, not the audit.
    #
    # Dependabot's token is read-only whatever this says, so its pull requests still
    # cannot publish the check; the same audit runs on every push to main, which is where
    # the answer actually matters.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
