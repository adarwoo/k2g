name: Audit

# EU CRA Annex I Part II (3): "apply effective and regular tests and reviews of the
# security of the product". Two complementary checks —
#
#   cargo audit  matches the dependency tree against the RUSTSEC advisory database,
#                which is the "identify vulnerabilities in the components" half of
#                Part II (1).
#   cargo deny   catches what an advisory feed cannot: unmaintained crates, licence
#                incompatibilities (k2g is GPL-3.0-only), and duplicate or yanked
#                versions.
#
# Scheduled as well as on-PR because the code not changing is exactly when a new
# advisory against an existing dependency goes unnoticed.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    runs-on: ubuntu-latest
    # `rustsec/audit-check` publishes its findings as a check run, and the default token
    # is read-only — so the job failed with "Resource not accessible by integration"
    # while reporting zero vulnerabilities. It was failing on the report, not the audit.
    #
    # Dependabot's token is read-only whatever this says, so its pull requests still
    # cannot publish the check; the same audit runs on every push to main, which is where
    # the answer actually matters.
    #
    # `issues: write` is the same failure a second time, on the path only the schedule
    # takes. The action reports as a *check run* on push and pull_request, but a scheduled
    # run has no commit to attach a check to, so it opens an issue instead — and without
    # this the weekly run died on "Resource not accessible by integration", pointing at
    # the create-an-issue endpoint, having again found nothing wrong. A schedule that
    # cannot report is a schedule that is not running: the whole point of the cron is to
    # catch an advisory filed against a dependency on a week nobody pushed.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Still on Node 20, and deliberately left there: it is the one action here with no
      # Node 24 release to move to. Upstream fixed it on `main` but has cut no tag since
      # v2.0.0, and pinning a security-audit action to an unreleased commit trades a
      # deprecation notice for an unreviewed one. The runner already forces it onto Node
      # 24 — the annotation is advisory, not a failure. Revisit when rustsec tags a v2.1.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
