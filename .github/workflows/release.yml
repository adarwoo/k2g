name: Release

# Tagging `vX.Y.Z-<codename>` builds, signs and publishes a release.
#
# The signing step is what makes k2g's in-app updater possible at all: it will not run
# an installer whose minisign signature does not verify against the key compiled into
# the running build (`assets/release-signing.pub`). A release published without its
# `.minisig` files is a release nobody can install through the updater — see
# `runtime::update::fetch_latest`, which treats a missing signature as a broken
# release rather than as permission to skip verification.
#
# The key is set up (public half `06B8B6495DD89857`). It was done once, like this, and
# is written down here because the next time anyone reads it will be the day it has to be
# rotated:
#
#   1. Generate an unencrypted keypair:   rsign generate -W -p k2g.pub -s k2g.key
#      Unencrypted is deliberate. A passphrase protects a key at rest against someone
#      who has the file; here the file *is* a repository secret, so the passphrase
#      would have to be stored next to it and would protect nothing.
#   2. Put the contents of `k2g.key` in the repository secret MINISIGN_SECRET_KEY.
#      Keep an offline copy — losing it means every installed build stops accepting
#      updates until users reinstall by hand.
#   3. Commit the contents of `k2g.pub` to `assets/release-signing.pub`. That file is
#      compiled into the application, so it is the half that decides what an installed
#      k2g will accept — and `.github/actions/sign-artifacts` verifies each signature
#      against it, so a mismatched pair fails the build instead of shipping installers
#      that every updater in the field rejects.
#
# Rotating the key is a breaking change for anyone already running k2g: their build has
# the old key compiled in and will refuse the new signatures, and they update by hand
# once. Only worth doing if the secret is compromised.

on:
  push:
    tags: [ "v*" ]
  # Manual runs build and sign but do not publish, so the pipeline can be exercised
  # without minting a release.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `build.rs` compares Cargo.toml's version against the nearest tag; a
          # shallow clone has no tags and the check silently passes.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Never ship a release that has not passed its own tests.
      - name: Test
        run: cargo test --workspace --release

      # Unconditional, because every later step names artifacts after it. Done as its
      # own step rather than folded into the tag check below: that check only runs for
      # a tag push, and a manual run would then leave the version empty and produce
      # files called `k2g--portable-windows-x64.zip`.
      - name: Read the declared version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          declared=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "k2g") | .version')
          test -n "$declared"
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          echo "Building k2g $declared"

      # The version in Cargo.toml is what the About screen, every G-code header and
      # the exe's file properties report. A tag that disagrees with it would publish
      # an installer whose contents lie about which release they are — and would make
      # the updater compare the wrong numbers, since it reads the tag and the running
      # build reads Cargo.toml.
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_core="${tag#v}"; tag_core="${tag_core%%-*}"
          if [ "$tag_core" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::tag $tag declares $tag_core but Cargo.toml says ${{ steps.meta.outputs.version }}"
            exit 1
          fi

      # Pinned to the `dioxus` version in Cargo.lock, and it has to stay in step with it:
      # `dx` refuses to bundle when the two differ. Unpinned, this step installs whatever
      # is newest — which is how a 0.7.10 CLI came to be pointed at a 0.7.9 application.
      - name: Install the Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Bundle
        run: dx bundle --platform desktop --release --package-types msi --package-types nsis

      # A portable build alongside the installers: the binary embeds every schema,
      # catalog, stylesheet and script it needs, so "unzip and run" genuinely works
      # and costs nothing to offer.
      - name: Portable zip
        shell: bash
        run: |
          set -euo pipefail
          # Nothing above this leaves a binary in `target/release`: `cargo test` builds
          # test harnesses, and `dx bundle` writes its own tree under `target/dx`. So
          # the zip builds what it is made of — this is the step the last release run
          # died on, with `cp: cannot stat 'target/release/k2g.exe'`. Everything those
          # binaries need is compiled in — schemas, catalogs, stylesheet, three.js — so
          # a plain cargo build *is* the portable build, and its dependencies are
          # already warm from the steps above.
          cargo build --release --bins
          mkdir -p staging
          cp target/release/k2g.exe staging/
          cp target/release/k2g-kicad-launcher.exe staging/
          cp README.md LICENSE PRIVACY.md SECURITY.md staging/ 2>/dev/null || true
          7z a "k2g-${{ steps.meta.outputs.version }}-portable-windows-x64.zip" ./staging/*

      # Annex I Part II (1): a machine-readable bill of materials covering at least
      # the top-level dependencies. cargo-cyclonedx emits the full transitive graph.
      - name: Software bill of materials
        shell: bash
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
          find . -name '*.cdx.json' -maxdepth 2 -print

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find target/dx -type f \( -name '*.msi' -o -name '*.exe' \) \
            -not -name 'k2g.exe' -not -name 'k2g-kicad-launcher.exe' \
            -exec cp {} dist/ \;
          cp ./*-portable-windows-x64.zip dist/ 2>/dev/null || true
          cp ./k2g.cdx.json "dist/k2g-${{ steps.meta.outputs.version }}.cdx.json" 2>/dev/null || true
          ls -la dist

      # Detached signatures over every artifact. This is the root of trust for the in-app
      # updater: TLS and GitHub's account security are not relied on, only this key.
      - name: Sign every artifact
        uses: ./.github/actions/sign-artifacts
        with:
          secret-key: ${{ secrets.MINISIGN_SECRET_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: k2g-windows
          path: dist/*

      # This job owns the release notes; the macOS one only adds its files. Whichever
      # finishes first creates the release, so the notes must not depend on the order.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Release notes reach users verbatim in the update banner, so they say what
          # the artifacts are and how to check them.
          body: |
            ## Installing this release

            **Windows** — `.msi` or `-setup.exe` to install, or the portable `.zip`.

            **macOS** — take the build for your Mac: `arm64` for Apple Silicon,
            `x86_64` for Intel. Unsigned means Gatekeeper will refuse it on the first
            open; clear the quarantine flag once with

            ```
            xattr -dr com.apple.quarantine /Applications/k2g.app
            ```

            or, for the portable tarball, on the extracted `k2g` binary.

            `k2g-<version>.cdx.json` is the CycloneDX software bill of materials for
            this build.

            ## Verifying what you downloaded

            Every artifact here is signed with minisign, and carries its detached
            `.minisig` beside it. k2g's own updater checks that signature before it will
            run an installer, and refuses one it cannot verify — so there is nothing you
            have to do. To check by hand:

            ```
            minisign -Vm k2g-<version>.msi -P RWRXmNhdSba4BtwDZDRNbvFIpLLW4dHBanW4oe0v8oc+M/z5qX7mcay4
            ```

            That key is also in the repository, at `assets/release-signing.pub` — which
            is the copy compiled into the application, so a release signed with anything
            else fails the build rather than reaching this page.

            ## Safety

            k2g emits programs that drive a physical CNC machine. Verify every program
            against the actual fixture, stock and tooling before running it.

  # macOS, both architectures, each on its own silicon — see the matching job in
  # `rust.yml` for why these are not cross-compiled from one runner.
  #
  # Deliberately **not** a universal binary. Two clearly named downloads say which Mac
  # each is for; one `lipo`'d fat binary would be half dead weight on every machine and
  # would have to be assembled by hand inside the .app bundle, which is a thing to get
  # wrong in a release pipeline nobody runs by hand.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    name: macos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # As in the Windows job: `build.rs` compares Cargo.toml's version against the
          # nearest tag, and a shallow clone has no tags to compare against.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --release

      - name: Read the declared version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          declared=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "k2g") | .version')
          test -n "$declared"
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          echo "Building k2g $declared for ${{ matrix.arch }}"

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_core="${tag#v}"; tag_core="${tag_core%%-*}"
          if [ "$tag_core" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::tag $tag declares $tag_core but Cargo.toml says ${{ steps.meta.outputs.version }}"
            exit 1
          fi

      # The artifact this job can stand behind. The binary embeds every schema, catalog,
      # stylesheet and script it needs, so an extracted `k2g` is a working k2g — no .app
      # wrapper required, and nothing to install.
      - name: Portable tarball
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --bins
          mkdir -p staging
          cp target/release/k2g staging/
          cp target/release/k2g-kicad-launcher staging/
          cp README.md LICENSE PRIVACY.md SECURITY.md staging/ 2>/dev/null || true
          tar -czf "k2g-${{ steps.meta.outputs.version }}-portable-macos-${{ matrix.arch }}.tar.gz" -C staging .

      # Pinned to Cargo.lock's `dioxus`, as in the Windows job — `dx` refuses to bundle
      # against an application built with a different version.
      - name: Install the Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked

      # Not gating, and that is a considered choice rather than laziness: no one has yet
      # opened a k2g .app on a Mac, so this pipeline cannot claim the bundle works — but
      # a bundler that trips must not cost the release its portable tarball, which does.
      # Make this fatal (drop `continue-on-error`) as soon as one release's .dmg has been
      # mounted and run by a person.
      - name: Bundle
        id: bundle
        continue-on-error: true
        run: dx bundle --platform desktop --release --package-types macos --package-types dmg

      # `continue-on-error` turns a failure into a green tick, which is exactly how a
      # release quietly stops carrying its .dmg. Say so in the run summary instead.
      - name: Note a bundle that did not build
        if: steps.bundle.outcome == 'failure'
        run: |
          echo "::warning::dx bundle failed on ${{ matrix.arch }} — this release ships the portable tarball only"

      # The SBOM is emitted by the Windows job only. It is one document per release and
      # the release assets are one flat namespace, so a second job writing the same file
      # name would be a race rather than extra information.
      - name: Collect artifacts
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # Renamed rather than taken as the bundler names them. A release's assets are
          # one flat namespace shared with the other architecture, and two files called
          # the same thing is not a collision anyone would notice until a Mac user
          # downloaded the wrong one. These names are also what the install docs promise.
          # `|| true` on both: the bundle step is allowed to fail, so `target/dx` may not
          # exist at all — and under `set -euo pipefail` a `find` that cannot open its
          # directory would end this step before the tarball is collected.
          dmg=$(find target/dx -type f -name '*.dmg' 2>/dev/null | head -1 || true)
          if [ -n "$dmg" ]; then
            cp "$dmg" "dist/k2g-${VERSION}-macos-${ARCH}.dmg"
          fi
          # `-prune` so find stops at the bundle instead of walking into it and finding
          # whatever .app frameworks live inside.
          app=$(find target/dx -type d -name '*.app' -prune 2>/dev/null | head -1 || true)
          if [ -n "$app" ]; then
            # `ditto`, not `zip`: it is the one that preserves the symlinks and resource
            # forks an .app is made of.
            ditto -c -k --keepParent "$app" "dist/k2g-${VERSION}-macos-${ARCH}-app.zip"
          fi

          cp "./k2g-${VERSION}-portable-macos-${ARCH}.tar.gz" dist/
          ls -la dist

      # As in the Windows job: every artifact this release publishes carries a signature
      # the updater can check, whichever platform produced it.
      - name: Sign every artifact
        uses: ./.github/actions/sign-artifacts
        with:
          secret-key: ${{ secrets.MINISIGN_SECRET_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: k2g-macos-${{ matrix.arch }}
          path: dist/*

      # Files only: the notes belong to the Windows job, and this action leaves fields it
      # is not given alone — so whichever job gets here first, the release ends up with
      # both platforms' assets and one set of notes.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
