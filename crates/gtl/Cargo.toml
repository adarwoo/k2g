[package]
name = "gtl"
version = "0.1.0"
# MIT, unlike the rest of k2g (GPL-3.0-only): GTL is generic and also used by
# non-GPL projects. MIT is GPL-compatible, so k2g can still link it.
license = "MIT"
edition = "2021"
# Internal (k2g, SignumRex), never published to crates.io. Stated rather than assumed:
# it is what lets cargo-deny accept the workspace's path dependencies.
publish = false
description = "Generic Template Language — a line-oriented Rhai scripting engine whose backtick-marked lines emit text, with typed `{ expr }` interpolation. Host-agnostic: it emits plain strings and the output dialect (formatting, domain functions) is registered by the host."

[dependencies]
rhai = "1"
thiserror = "2"
