[package]
name = "datastore"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2021"
# Internal to k2g, never published to crates.io. Stated rather than assumed:
# it is what lets cargo-deny accept the workspace's path dependencies.
publish = false
description = "Generic schema-driven data store: validate, default, type units/ids, and resolve references from JSON Schema."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
jsonschema = "0.49"
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
units = { path = "../units" }

[dev-dependencies]
tempfile = "3"
