[package]
name = "pcb"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2021"
# Internal to k2g, never published to crates.io. Stated rather than assumed:
# it is what lets cargo-deny accept the workspace's path dependencies.
publish = false
description = "PCB acquisition from KiCad — multi-instance discovery, document enumeration, snapshot collection, and edge-cut stitching."

[dependencies]
units = { path = "../units" }
kicad-ipc-rs = { version = "0.5.1", features = ["blocking"] }
clipper2-rust = "1.0"
thiserror = "2"
log = "0.4"
