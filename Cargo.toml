[package]
name = "k2g"
# The release version, and the single source of truth for it: the About screen, the
# `k2g_version` a G-code header can print, the Windows executable's file properties
# (seeded from CARGO_PKG_* by `build.rs`) and the crate metadata all read this one
# value. `build.rs` warns when it falls behind the newest `vX.Y.Z-*` git tag, which is
# how it reached 0.10.0 having sat at 0.1.0 through nine of them.
version = "0.13.0"
edition = "2021"
description = "GCode generator"
authors = ["Bill Arreckx <software@arreckx.com>"]
homepage = "https://github.com/adarwoo/k2g"
repository = "https://github.com/adarwoo/k2g"
# GPL-3.0-**only**, not `-or-later`: the copyleft is the point, and "or later" would
# let a future FSF licence govern this work sight-unseen. Bumping it later is a
# one-word change; narrowing it after the fact is not.
#
# The vendored `third_party/kicad-ipc-rs` and `assets/vendor/three.bundle.js` are MIT
# and stay MIT — MIT is GPL-compatible, so they may be combined into this GPL work
# while keeping their own notices (both carry them in-tree).
license = "GPL-3.0-only"
# k2g is an application, released as signed binaries from GitHub, and its libraries are
# internal to it. None of this goes to crates.io — which is a fact worth stating rather
# than leaving to nobody ever typing `cargo publish`: it is also what lets cargo-deny's
# `allow-wildcard-paths` accept the `{ path = ... }` sibling dependencies below, since a
# path dependency is only unpublishable-by-definition for a crate that is not published.
publish = false
# The package ships two binaries — the application, and the small shim KiCad executes
# (`src/bin/k2g-kicad-launcher.rs`). Without this, a bare `cargo run` cannot choose
# between them and errors out. The shim is never run by hand.
default-run = "k2g"

[workspace]
members = [
    ".",
    "crates/datastore",
    "crates/gtl",
    "crates/pcb",
    "crates/units",
    "third_party/kicad-ipc-rs",
    "xtask",
]

# Vendored fork of kicad-ipc-rs (Milind220/kicad-ipc-rs 0.5.1). Four changes, all of
# them recovering geometry upstream maps away, all kept until they land upstream; see
# third_party/kicad-ipc-rs.
#
# The pattern is worth naming, because it has now caught us four times: upstream
# decodes a shape down to a *count* of its parts and drops the parts. Nothing errors —
# the board simply arrives with less on it than KiCad has, and whatever we do next is
# quietly wrong rather than loudly broken.
#
#   * `PcbPadStack.angle_degrees` — the pad-stack orientation, which we need to
#     machine rotated oblong/slot drills.
#   * `PcbGraphicShapeGeometry::Polygon.polygons` — the actual vertices of a polygon
#     shape, where upstream keeps only how many there are. A cutout drawn with
#     KiCad's polygon tool is otherwise invisible to us: it has no geometry to
#     stitch, so it silently never gets machined.
#   * `PcbZone.filled_polygons` / `.outline` / `.net` — the copper a pour actually
#     puts down, after KiCad's filler has applied clearance, thermal relief and
#     island removal, plus the net it belongs to. This is the one piece of board
#     geometry we could not reasonably recompute: reproducing it means reproducing
#     the filler.
#   * `PcbPadStack.copper_layers` — shape and size of the pad on each layer. Pads
#     have a better route (`GetPadShapeAsPolygon`), but a **via** has none, so
#     without this a via is a hole with no copper around it.
[patch.crates-io]
kicad-ipc-rs = { path = "third_party/kicad-ipc-rs" }

[dependencies]
units = { path = "crates/units" }
pcb = { path = "crates/pcb" }
datastore = { path = "crates/datastore" }
gtl = { path = "crates/gtl" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
dioxus = { version = "0.7", features = ["desktop"] }
rhai = "1"
thiserror = "2"
serde_json = "1"
serde_yaml = "0.9"
jsonschema = "0.28"
log = "0.4"
image = "0.24"
base64 = "0.22"
rfd = "0.15"
# Resolves the host's default save location (Windows Downloads known folder,
# XDG_DOWNLOAD_DIR on Linux) for the first G-code save.
dirs = "6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
uuid = { version = "1", features = ["v5", "v7"] }
dioxus-logger = "0.7.9"
tracing = "0.1.44"
tracing-subscriber = { version="0.3.23", features = ["env-filter"] }
chrono = "0.4"
synoptic = "2"
# The update check (`runtime::update`) — the application's only outbound request.
# `rustls-tls` rather than the default `native-tls`: one TLS stack whose trust
# decisions are the same on every platform, and no OpenSSL to track advisories for.
# Blocking, because the check runs on its own thread rather than in an async runtime.
# `reqwest` is already in the tree via `jsonschema`, so this adds no new supply chain.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
# Verifies the signature on a downloaded installer before k2g will run it. Pure Rust,
# no key infrastructure beyond a keypair in a CI secret, and small enough to audit.
# Without this the update channel would be a remote-code-execution path, which is
# worse than shipping no updater at all (EU CRA Annex I Part II (7)).
minisign-verify = "0.2"
# Hands a URL to the system browser. Without it, clicking a link in the About screen
# navigates the application's *own* WebView — the window has no browser chrome, so the
# user is left stranded in a web page with no way back to k2g.
open = "5"

[dev-dependencies]
tempfile = "3"
# Signing half of the release-verification pair. Test-only: k2g never signs anything,
# it only verifies (`minisign-verify`). Needed so the update tests can prove the two
# assertions that matter — that a correctly signed artifact is accepted, and that a
# single flipped byte is rejected — instead of only testing malformed input.
minisign = "0.9"

# Windows-only: the removable-media (USB key / SD card) detect + eject facility in
# `src/runtime/removable/win32.rs`, which is the only `unsafe` in this crate.
# `windows-sys` rather than `windows`: 0.61 is already in the lockfile via
# tokio/rfd/dirs-sys, so this compiles no additional crate, and the higher-level
# wrappers would still be `unsafe` at every call site while pulling `windows-core` in
# for a handful of kernel32 entry points.
# Linux-only: asking GTK for the dark variant of the desktop theme, so the parts of the
# UI the webview does not draw follow k2g's own light/dark setting. A `<select>` popup is
# the visible case — WebKitGTK hands it to GTK, which paints it from the desktop theme and
# not from our stylesheet, so a dark k2g on a light desktop opened a white list.
#
# Adds nothing to the build: `gtk` is already in the lockfile, because tao's Linux backend
# is written against it. The version is pinned to tao's to keep it that way — a mismatch
# would compile a second copy of the whole gtk stack.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    # HANDLE, INVALID_HANDLE_VALUE, CloseHandle, GENERIC_READ/GENERIC_WRITE
    "Win32_Foundation",
    # SECURITY_ATTRIBUTES — CreateFileW is gated on this feature because its
    # signature names the type, even though we only ever pass null. Dropping this
    # from the list fails as "cannot find function `CreateFileW`", which reads like
    # a wrong module path rather than a missing feature.
    "Win32_Security",
    # GetLogicalDrives, GetDriveTypeW, GetVolumeInformationW, GetDiskFreeSpaceExW,
    # CreateFileW, FlushFileBuffers, FILE_SHARE_*, OPEN_EXISTING, and STORAGE_BUS_TYPE /
    # BusTypeUsb — which live here rather than beside the IOCTL that reports them.
    "Win32_Storage_FileSystem",
    # DRIVE_REMOVABLE — which lives here, not beside GetDriveTypeW that returns it.
    "Win32_System_WindowsProgramming",
    # SetThreadErrorMode / SEM_FAILCRITICALERRORS — suppresses the modal "There is no
    # disk in the drive" box when probing an empty card reader.
    "Win32_System_Diagnostics_Debug",
    # DeviceIoControl
    "Win32_System_IO",
    # FSCTL_LOCK_VOLUME / FSCTL_DISMOUNT_VOLUME, IOCTL_STORAGE_MEDIA_REMOVAL /
    # IOCTL_STORAGE_EJECT_MEDIA, PREVENT_MEDIA_REMOVAL, and IOCTL_STORAGE_QUERY_PROPERTY
    # with STORAGE_PROPERTY_QUERY / STORAGE_DEVICE_DESCRIPTOR — the bus-type test that
    # keeps virtual drive letters out of the removable-media list.
    "Win32_System_Ioctl",
    # CreateToolhelp32Snapshot / Process32FirstW / Process32NextW — used by
    # `runtime::kicad_integration` to refuse editing kicad_common.json while KiCad
    # is running, since KiCad rewrites that file wholesale when it exits.
    "Win32_System_Diagnostics_ToolHelp",
    # FindWindowW / IsIconic / ShowWindow / SetForegroundWindow — how a second launch
    # brings the running k2g's window forward instead of starting a second copy
    # (`runtime::single_instance`). There is no portable equivalent, which is why that
    # hand-off is a message box everywhere else.
    "Win32_UI_WindowsAndMessaging",
] }

# Windows-only: `build.rs` compiles the app icon into the `.exe` as a Windows
# resource. Cargo matches `[target.*.build-dependencies]` against the **host**, so
# these are fetched only when building on Windows; the build script additionally
# checks the target OS so a cross-compile off Windows skips the resource.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
# Renders the multi-size `.ico` from the single PNG source, so there is no second
# icon file to keep in sync.
image = "0.24"
