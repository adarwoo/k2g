$schema: http://json-schema.org/draft-07/schema#
x-schema-version: 1
type: object
description: |
  This file is written Yaml (Yaml.org)

  Scalars can be specified as numbers or strings.
   - Numbers are always interpreted as metric ('mm', 'mm/min' or 'rpm')
   - Strings can have units and fractions:
       . Valid units for sizes are 'cm', 'mm', 'in', 'inch', 'mil' or 'thou'
       . Valid feedrate units are 'mm/min', 'mm/s', 'in/min' or 'ipm'
       - Example: 4um, 12.4mm 23/64in, 100in/min, 24000rpm, 12deg

properties:
  # Version of this schema
  schema_version:
    type: integer
    const: 1
    description: Schema/data format version for this file.

  units:
    description: Global preferred unit system and display units.
    type: string
    enum: [mm, mil, in]
    default: mm
  theme:
    description: Application theme.
    type: string
    enum: [Light, Dark]
    default: Light

  selected_process_profile_id:
    description: |
      ID of the currently selected process profile.
    type: [string, "null"]
    default: null

  selected_cnc_profile_id:
    description: |
      ID of the currently selected CNC profile.
    type: [string, "null"]
    default: null

  selected_fixture_profile_id:
    description: |
      ID of the currently selected fixture profile.
    type: [string, "null"]
    default: null

  selected_toolset_profile_id:
    description: |
      ID of the currently selected toolset profile.
    type: [string, "null"]
    default: null

  # The keys below are deliberately NOT in `required`: validation runs before schema
  # defaults are injected, so requiring an added key would reject every settings file
  # written before that key existed.

  job_view_pinned:
    description: |
      Whether the Job view stays docked on the left of the profile screens, so edits
      to a profile or to stock can be seen taking effect without navigating back.
      Ignored when the window is too narrow to hold both columns.
    type: boolean
    default: false

  job_pin_width:
    description: |
      Width in pixels of the docked Job column, as left by the split handle. Treated
      as a preference, not a guarantee — the layout still caps it against the window
      so the screen beside it stays usable.
    type: integer
    minimum: 320
    maximum: 1200
    default: 560

  gcode_save_directory:
    description: |
      Directory the last G-code save wrote to, so the next Save opens where the
      previous one left off. Null until the first save; a directory that has since
      been moved or deleted falls back to the host's default download location.
    type: [string, "null"]
    default: null

  last_removable_media_path:
    description: |
      Directory on removable media the last "Save to USB" wrote to, so the next one
      opens where the previous left off. Null until the first such save. Kept apart
      from `gcode_save_directory` deliberately: a USB save must not drag the ordinary
      Save dialog onto a drive that will not be plugged in tomorrow. Only the drive
      letter is matched against the media present at save time — a letter since reused
      by a different stick falls back to that stick's root.
    type: [string, "null"]
    default: null

  window_width:
    description: |
      Inner width of the application window in logical (DPI-independent) pixels, as the
      user last left it. Logical rather than device pixels so moving the window to a
      display with a different scale factor reopens it the same apparent size. While the
      window is maximized this keeps the *restored* size, so un-maximizing gives back the
      window that was maximized rather than a screen-sized one.
    type: integer
    minimum: 640
    maximum: 20000
    default: 1400

  window_height:
    description: |
      Inner height of the application window in logical pixels. See `window_width`; a
      size that no longer fits the display it reopens on is shrunk at launch.
    type: integer
    minimum: 480
    maximum: 20000
    default: 900

  window_maximized:
    description: |
      Whether the window was maximized when the application last closed.
    type: boolean
    default: false

  # --- Updates and security recording -------------------------------------
  # Both switches below default to `true` and are user-disableable. That
  # direction is deliberate and is what EU CRA Annex I (2)(c) and (2)(l) ask
  # for: the protective behaviour is the default, and the user gets a clear
  # opt-out rather than an opt-in. Flipping either default would quietly
  # reverse that, so treat them as load-bearing rather than as taste.

  update_check_enabled:
    description: |
      Whether k2g asks GitHub, at most once a day, whether a newer release exists.
      This is the application's only outbound network request; disabling it makes
      k2g fully offline. Note that performing the check discloses the machine's IP
      address and the k2g User-Agent to GitHub — see PRIVACY.md. Nothing is
      downloaded or installed without an explicit confirmation.
    type: boolean
    default: true

  update_last_check:
    description: |
      RFC 3339 UTC timestamp of the last completed update check, used to hold the
      check to once per 24 hours. Null until the first check runs. A check that
      fails (offline, rate-limited) still stamps this, so a machine with no network
      retries daily rather than on every launch.
    type: [string, "null"]
    default: null

  update_skipped_version:
    description: |
      A release the user chose to skip, as a bare `X.Y.Z`. That version alone stops
      being offered; a later one is announced normally. Null when nothing is skipped.
    type: [string, "null"]
    default: null

  update_postponed_until:
    description: |
      RFC 3339 UTC timestamp before which no update banner is shown, set by "Remind
      me later". Distinct from `update_skipped_version`: postponing silences every
      version for a while, skipping silences one version forever.
    type: [string, "null"]
    default: null

  security_log_enabled:
    description: |
      Whether security-relevant events are appended to `logs/security.jsonl` — update
      checks and installs, opt-out changes, KiCad plugin registration and API-setting
      edits, config rejections, G-code writes, resets and data deletion. Separate from
      the diagnostic log, which is in-memory only and never written to disk. Home
      directory paths are redacted to `~` before writing, so the file holds no personal
      data. Disabling it stops writing immediately; existing files can then be deleted
      from the Settings screen.
    type: boolean
    default: true

required:
  [
    units,
    theme,
    selected_process_profile_id,
    selected_cnc_profile_id,
    selected_fixture_profile_id,
    selected_toolset_profile_id,
  ]
additionalProperties: false
