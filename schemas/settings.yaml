$schema: http://json-schema.org/draft-07/schema#
x-schema-version: 1
type: object
description: |
  This file is written Yaml (Yaml.org)

  Scalars can be specified as numbers or strings.
   - Numbers are always interpreted as metric ('mm', 'mm/min' or 'rpm')
   - Strings can have units and fractions:
       . Valid units for sizes are 'cm', 'mm', 'in', 'inch', 'mil' or 'thou'
       . Valid feedrate units are 'mm/min', 'mm/s', 'in/min' or 'ipm'
       - Example: 4um, 12.4mm 23/64in, 100in/min, 24000rpm, 12deg

properties:
  # Version of this schema
  schema_version:
    type: integer
    const: 1
    description: Schema/data format version for this file.

  units:
    description: Global preferred unit system and display units.
    type: string
    enum: [mm, mil, in]
    x-enum-labels: [Millimetres, Mil, Inches]
    default: mm
  theme:
    description: Application theme.
    type: string
    enum: [Light, Dark]
    default: Light

  selected_process_profile_id:
    description: |
      ID of the currently selected process profile.
    type: [string, "null"]
    default: null

  selected_cnc_profile_id:
    description: |
      ID of the currently selected CNC profile.
    type: [string, "null"]
    default: null

  selected_fixture_profile_id:
    description: |
      ID of the currently selected fixture profile.
    type: [string, "null"]
    default: null

  selected_toolset_profile_id:
    description: |
      ID of the currently selected toolset profile.
    type: [string, "null"]
    default: null

  # The keys below are deliberately NOT in `required`: validation runs before schema
  # defaults are injected, so requiring an added key would reject every settings file
  # written before that key existed.

  job_view_pinned:
    description: |
      Whether the Job view stays docked on the left of the profile screens, so edits
      to a profile or to stock can be seen taking effect without navigating back.
      Ignored when the window is too narrow to hold both columns.
    type: boolean
    default: false

  job_pin_width:
    description: |
      Width in pixels of the docked Job column, as left by the split handle. Treated
      as a preference, not a guarantee — the layout still caps it against the window
      so the screen beside it stays usable.
    type: integer
    minimum: 320
    maximum: 1200
    default: 560

  export_directories:
    description: |
      Where **Export** last wrote, remembered per volume: the machine's disk and each
      USB stick keep their own, so plugging a stick in offers the folder that stick was
      last written to rather than the one on the hard disk.

      An array rather than a map keyed by volume, because this schema dialect carries no
      `patternProperties` and a key-per-volume object cannot be expressed. `job.yaml`'s
      `edge_tabs` is the same shape for the same reason.

      Ordered **most recently used first**, and that ordering is load-bearing rather than
      tidiness: an ordinary Export has no volume to look up until it has a path, so "the
      most recent entry that is not a stick and still exists" is what answers it — which
      is also what gives each fixed drive its own memory.

      Trimmed by the application rather than by `maxItems` here: a list that outgrew a
      schema bound would be reported as a load problem and recorded as a rejected
      configuration, and a noisy launch is a worse outcome than a long list.
    type: array
    default: []
    items:
      type: object
      properties:
        volume:
          description: |
            Which volume the path is on:

              * `usb:1A2B3C4D` — a removable medium, filed under its **filesystem volume
                serial**, so the folder survives the stick returning on a different drive
                letter, and two sticks that have both been `E:` keep their own. Only the
                part of the path after the drive prefix is honoured, so it re-bases onto
                whichever letter the stick holds now. The serial belongs to the
                filesystem, not the hardware: **reformatting a stick mints a new one**,
                after which its old entry is never matched again and ages out.
              * `drive:C` — a fixed drive, filed under its letter, which for a drive that
                is never ejected is a stable identity. Also the provisional key a migrated
                `last_removable_media_path` lands under, until the first Export to that
                stick re-files it under the serial.
              * `host` — a platform with no drive letters (Linux, macOS), where there is
                one destination to remember.
          type: string
          minLength: 1
        path:
          description: |
            The directory last exported to, absolute. Used only while it still exists; a
            folder since deleted falls back to that volume's own default — the root of
            the device for a stick, the host's download folder otherwise.
          type: string
          minLength: 1

  gcode_save_directory:
    description: |
      Superseded by `export_directories`, and no longer read: this is written as a mirror
      of the most recent entry that is not on a stick, so that downgrading to a build
      predating the per-volume table still finds its folder. Remove once no supported
      build reads it.
    type: [string, "null"]
    default: null

  last_removable_media_path:
    description: |
      Superseded by `export_directories`, and no longer read: written as a mirror of the
      most recent entry that *is* on a stick, on the same terms as `gcode_save_directory`
      above. It was matched by drive letter alone, which is what the volume serial in the
      new table exists to fix — a letter is handed to whatever is plugged in next.
    type: [string, "null"]
    default: null

  window_width:
    description: |
      Inner width of the application window in logical (DPI-independent) pixels, as the
      user last left it. Logical rather than device pixels so moving the window to a
      display with a different scale factor reopens it the same apparent size. While the
      window is maximized this keeps the *restored* size, so un-maximizing gives back the
      window that was maximized rather than a screen-sized one.
    type: integer
    minimum: 640
    maximum: 20000
    default: 1400

  window_height:
    description: |
      Inner height of the application window in logical pixels. See `window_width`; a
      size that no longer fits the display it reopens on is shrunk at launch.
    type: integer
    minimum: 480
    maximum: 20000
    default: 900

  window_maximized:
    description: |
      Whether the window was maximized when the application last closed.
    type: boolean
    default: false

  # --- Where the operator was ----------------------------------------------
  # These restore the workspace rather than configure it, and the three navigation
  # keys are written when the window closes rather than as the user navigates:
  # nothing but the next launch reads them, and every settings write re-validates
  # and re-resolves the whole store on the calling thread.

  reopen_where_left_off:
    description: |
      Whether k2g reopens on the screen, Job tab and machining step the last session
      ended on. With this off the three keys below are still recorded but ignored at
      launch, so turning it back on takes effect immediately rather than after a
      session of relearning. Absent means on, so a settings file written before this
      existed opts in.
    type: boolean
    default: true

  selected_screen:
    description: |
      The navigation-rail screen the last session was left on, as its stable key. A
      key this build does not recognise — a file from a newer version, or edited by
      hand — opens on `job` rather than on nothing.
    type: string
    enum:
      [
        job,
        cnc-profiles,
        fixture-profiles,
        machining-profiles,
        toolset-profiles,
        stock,
        catalog,
        manual,
        logs,
        about,
      ]
    default: job

  selected_job_view:
    description: |
      The Job screen's open tab, as its stable key. Shared with the column docked
      beside the profile screens, so both reopen on the tab that was left open.
      `rack` is stored even when the current job has no tool changer: the view falls
      back to `board` for as long as that holds and returns by itself once an ATC
      machine is selected again. Normalising it away here would discard the
      operator's choice permanently the first time they opened a profile without a
      changer.
    type: string
    enum: [board, machining, code, tooling, rack]
    default: board

  selected_step:
    description: |
      Zero-based index of the machining step every Job view shows. The real ceiling
      is the selected machining profile's step count, which this file cannot know, so
      the value is clamped to it at launch — a profile that has since lost steps
      reopens on its last one rather than on nothing. The bound below is only a
      sanity rail against a hand-edited file.
    type: integer
    minimum: 0
    maximum: 999
    default: 0

  # --- Updates and security recording -------------------------------------
  # Both switches below default to `true` and are user-disableable. That
  # direction is deliberate and is what EU CRA Annex I (2)(c) and (2)(l) ask
  # for: the protective behaviour is the default, and the user gets a clear
  # opt-out rather than an opt-in. Flipping either default would quietly
  # reverse that, so treat them as load-bearing rather than as taste.

  update_check_enabled:
    description: |
      Whether k2g asks GitHub, at most once a day, whether a newer release exists.
      This is the application's only outbound network request; disabling it makes
      k2g fully offline. Note that performing the check discloses the machine's IP
      address and the k2g User-Agent to GitHub — see PRIVACY.md. Nothing is
      downloaded or installed without an explicit confirmation.
    type: boolean
    default: true

  update_last_check:
    description: |
      RFC 3339 UTC timestamp of the last completed update check, used to hold the
      check to once per 24 hours. Null until the first check runs. A check that
      fails (offline, rate-limited) still stamps this, so a machine with no network
      retries daily rather than on every launch.
    type: [string, "null"]
    default: null

  update_skipped_version:
    description: |
      A release the user chose to skip, as a bare `X.Y.Z`. That version alone stops
      being offered; a later one is announced normally. Null when nothing is skipped.
    type: [string, "null"]
    default: null

  update_postponed_until:
    description: |
      RFC 3339 UTC timestamp before which no update banner is shown, set by "Remind
      me later". Distinct from `update_skipped_version`: postponing silences every
      version for a while, skipping silences one version forever.
    type: [string, "null"]
    default: null

  security_log_enabled:
    description: |
      Whether security-relevant events are appended to `logs/security.jsonl` — update
      checks and installs, opt-out changes, KiCad plugin registration and API-setting
      edits, config rejections, G-code writes, resets and data deletion. Separate from
      the diagnostic log, which is in-memory only and never written to disk. Home
      directory paths are redacted to `~` before writing, so the file holds no personal
      data. Disabling it stops writing immediately; existing files can then be deleted
      from the Settings screen.
    type: boolean
    default: true

  # ---------------------------------------------------------------------------
  # Isolation engraving — how far into the substrate the V-bit is allowed to go.
  #
  # A V-bit cuts as wide as it is deep, so the channel it makes is
  #
  #     width = tip + 2·depth·tan(angle/2)
  #
  # and `depth` here is measured from the board surface: it has to clear the
  # copper before a single micron of it is doing anything, and everything past
  # that is cut into the laminate. So the depth is the copper thickness (from
  # KiCad's stackup) **plus** a penetration into the substrate, and it is the
  # penetration these two bound.
  #
  # They are here rather than on a machining profile because they are properties
  # of the process, not of a job: the same pair suits every board this machine
  # cuts, and one place to set them is one place to get them right.
  #
  # Between them they are also what chooses the bit. Every V-bit in stock can be
  # asked "what width do you cut at each end of that range?", and the answer
  # decides which are eligible at all — see `pick_engraver`.
  # ---------------------------------------------------------------------------
  engrave_penetration_min:
    title: Minimum substrate penetration
    description: >-
      How far past the copper the V-bit must go, at the least. Copper thickness
      alone would leave the tip cutting exactly nothing, so this is what makes
      the channel a channel — and with it, the narrowest cut any given bit can
      make. Raise it if isolation cuts come out incomplete, at the cost of a
      wider channel everywhere.
    $ref: "units.yaml#/$defs/size"
    default: 20um

  engrave_penetration_max:
    title: Maximum substrate penetration
    description: >-
      How far past the copper the V-bit may go at most, and so how wide a
      channel a given bit is allowed to open out to. This is what stops a fine
      tip being driven a third of the way through the board to reach a width it
      was never suited to — a bit that needs more than this to reach the
      requested width is not eligible, and a broader tip is chosen instead.
    $ref: "units.yaml#/$defs/size"
    default: 100um

required:
  [
    units,
    theme,
    selected_process_profile_id,
    selected_cnc_profile_id,
    selected_fixture_profile_id,
    selected_toolset_profile_id,
  ]
additionalProperties: false
