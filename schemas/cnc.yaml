$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "cnc.yaml"
x-schema-version: 1

title: CNC Profile
description: >
  CNC profile persisted configuration. This file controls the emitted GCode
  for a CNC machine. The `primitives` templates are written in the GCode
  Template Language (GTL): a line starting with a backtick emits GCode, every
  other line is Rhai script, and `{expr}` inside an emit line is evaluated and
  unit-converted. See docs/gcode-template-language.md for the full grammar.

  This schema references shared UUID and unit definitions from files located in
  the same directory:
    - id.yaml
    - units.yaml

type: object

properties:

  # Version of this schema
  schema_version:
    type: integer
    const: 1
    description: Schema/data format version for this file.

  # ---------------------------------------------------------------------------
  # id
  # ---------------------------------------------------------------------------
  # Stable unique CNC profile identifier.
  #
  # Uses the shared UUIDv7 validator from id.yaml.
  #
  # Valid example:
  #   id: "01890fdb-4daf-7a37-8f6a-9dc397e5b4ef"
  #
  id:
    description: Unique CNC profile ID.
    $ref: "id.yaml#/$defs/uuid_v7"

  # ---------------------------------------------------------------------------
  # name
  # ---------------------------------------------------------------------------
  # Human-readable CNC profile name.
  #
  # Valid examples:
  #   name: "Genmitsu 3018-Pro"
  #   name: "Masso G3 - With ATC"
  #
  name:
    description: User-facing CNC profile name.
    type: string
    minLength: 1
    default: "My CNC profile"

  # ---------------------------------------------------------------------------
  # machine
  # ---------------------------------------------------------------------------
  # Physical machine configuration.
  #
  machine:
    description: Physical machine configuration.
    type: object
    properties:

      # -----------------------------------------------------------------------
      # spindle_rpm_min
      # -----------------------------------------------------------------------
      # Minimum spindle speed. Unit is optional and defaults to RPM in the
      # application.
      #
      # Valid examples:
      #   spindle_rpm_min: 1000
      #   spindle_rpm_min: "1000"
      #   spindle_rpm_min: "1000 rpm"
      #   spindle_rpm_min: "1000rpm"
      #
      spindle_rpm_min:
        description: Minimum spindle speed. Bare numbers are interpreted as rpm.
        default: "10000rpm"
        $ref: "units.yaml#/$defs/rpm"

      # -----------------------------------------------------------------------
      # spindle_rpm_max
      # -----------------------------------------------------------------------
      # Maximum spindle speed. Unit is optional and defaults to RPM in the
      # application.
      #
      # Valid examples:
      #   spindle_rpm_max: 24000
      #   spindle_rpm_max: "24000"
      #   spindle_rpm_max: "24000 rpm"
      #   spindle_rpm_max: "24000rpm"
      #
      spindle_rpm_max:
        description: Maximum spindle speed. Bare numbers are interpreted as rpm.
        default: "24000rpm"
        $ref: "units.yaml#/$defs/rpm"

      # -----------------------------------------------------------------------
      # max_feed_xy
      # -----------------------------------------------------------------------
      # The fastest the machine can actually feed in the XY plane, from its
      # specification — not a preference. A tool rated faster than this is run at a
      # lower spindle speed so its chip load is still met (see max_feed_z).
      #
      # Valid examples:
      #   max_feed_xy: "5000mm/min"
      #   max_feed_xy: "5000 mm/min"
      #   max_feed_xy: "200 ipm"
      #
      max_feed_xy:
        description: >
          Maximum feed rate the machine can sustain in the XY plane. Used to cap
          routing feeds: a tool whose rated feed exceeds it is run at a proportionally
          lower spindle speed rather than simply being fed slower, so feed per
          revolution is preserved.
        default: "5000mm/min"
        $ref: "units.yaml#/$defs/feed"

      # -----------------------------------------------------------------------
      # max_feed_z
      # -----------------------------------------------------------------------
      # The Z axis is usually the slow one, and drilling is *entirely* Z motion, so
      # this is the limit that most often binds. Kept separate from max_feed_xy
      # precisely so a slow Z does not needlessly throttle lateral routing.
      #
      # Valid examples:
      #   max_feed_z: "5000mm/min"
      #   max_feed_z: "1500 mm/min"
      #
      max_feed_z:
        description: >
          Maximum feed rate the machine can sustain on Z. Binds every drilling plunge,
          and the entry plunge of a routing pass. Usually lower than max_feed_xy.
        default: "5000mm/min"
        $ref: "units.yaml#/$defs/feed"

      # -----------------------------------------------------------------------
      # output_file_extension
      # -----------------------------------------------------------------------
      # What a saved program for this machine is called. A machining step names its
      # own CNC, and the CNC's primitives decide the output *format* — a step whose
      # primitives emit Excellon should not be saved as `.nc`.
      #
      # Written without the dot. Valid examples:
      #   output_file_extension: nc
      #   output_file_extension: ngc
      #   output_file_extension: drl
      #
      output_file_extension:
        description: >
          Extension for programs saved for this machine, without the leading dot. The
          CNC's primitives decide the output format, so the extension belongs with them
          rather than with the save dialog.
        type: string
        pattern: '^[A-Za-z0-9]{1,8}$'
        default: "nc"

      # -----------------------------------------------------------------------
      # atc_slot_count
      # -----------------------------------------------------------------------
      # Number of automatic tool changer slots.
      #
      # 0 means ATC is disabled and manual tool change is used.
      #
      # Valid examples:
      #   atc_slot_count: 0
      #   atc_slot_count: 12
      #
      atc_slot_count:
        description: Number of ATC slots. 0 means ATC is disabled.
        type: integer
        minimum: 0
        default: 0

      # -----------------------------------------------------------------------
      # scaling
      # -----------------------------------------------------------------------
      # Axis scaling factors.
      #
      # 1.0 means no scaling.
      #
      scaling:
        description: >
          Axis scaling multipliers. A value of 1.0 means no scaling.
          Values are applied as output = input * scaling.

        type: object
        properties:

          # X axis scaling multiplier.
          #
          # Valid examples:
          #   x: 1.0
          #   x: 0.9995
          #
          x:
            description: X axis scaling multiplier.
            type: number
            default: 1.0

          # Y axis scaling multiplier.
          #
          # Valid examples:
          #   y: 1.0
          #   y: 1.0002
          #
          y:
            description: Y axis scaling multiplier.
            type: number
            default: 1.0

        required: [x, y]
        additionalProperties: false

      # Line numbering was once `line_numbering_increment` here — a bare integer the
      # application turned into "N<n> " itself. That put GCode in the application, and
      # split the format across two places. It is now entirely the
      # `primitives.line_number` template, whose arithmetic carries the increment.
      # Profiles are migrated on load (`normalize_cnc_value` in src/data/mod.rs).

      # -----------------------------------------------------------------------
      # has_repeatable_home
      # -----------------------------------------------------------------------
      # Whether the machine homes to a repeatable machine-coordinate origin.
      #
      # This is the single most important zeroing fact. When true, the work origin
      # can be established once and reused for every job (and the machine-bed height
      # becomes a known coordinate the app can persist), so subsequent runs need no
      # touch-off. When false (the cheapest controllers), the operator must set the
      # work zero on every job.
      #
      # Valid examples:
      #   has_repeatable_home: true
      #   has_repeatable_home: false
      #
      has_repeatable_home:
        description: >
          True if the machine homes to a repeatable machine-coordinate system.
          Enables set-once / persisted work origin and bed reference; false means
          the operator re-establishes the work zero each job.
        type: boolean
        default: false

      # (`work_coordinate_systems` — a count of stored zero points — was retired
      # here. It existed so the planner could refuse a fixture whose *ordinal*
      # exceeded the machine's count, and a fixture no longer holds an ordinal: it
      # names its origin in the machine's own words (`fixture.yaml#/origin_reference`)
      # and the `set_origin` primitive below decides what this controller accepts.
      # A count cannot express `G54.1 P1..P100`, and two places defining validity is
      # how they drift. Retired keys are dropped on load — see `normalize_cnc_value`.)

      # -----------------------------------------------------------------------
      # tool_length_measurement
      # -----------------------------------------------------------------------
      # How the controller establishes each tool's length (its Z offset).
      #
      #   auto_setter — a tool-length probe/setter measures every tool at M06
      #                 automatically (e.g. a MASSO with a tool setter); the
      #                 generated program needs nothing extra for Z per tool.
      #   manual      — the operator sets tool length / re-zeros Z on each tool
      #                 change; the program pauses and prompts.
      #
      # Valid examples:
      #   tool_length_measurement: auto_setter
      #   tool_length_measurement: manual
      #
      tool_length_measurement:
        description: >
          How tool length (the Z offset) is established. 'auto_setter' means a tool
          setter measures each tool automatically at M06; 'manual' means the
          operator re-zeros Z per tool change.
        type: string
        enum: [manual, auto_setter]
        default: manual

    required:
      - spindle_rpm_min
      - spindle_rpm_max
      # Required, but both carry a default, so a profile written before they existed
      # loads with the conservative 5000mm/min filled in rather than being rejected.
      - max_feed_xy
      - max_feed_z
      # Likewise defaulted, so an older profile loads as the G-code machine it was.
      - output_file_extension
      - atc_slot_count
      - scaling

    additionalProperties: false

# ---------------------------------------------------------------------------
  # primitives
  # ---------------------------------------------------------------------------
  # Primitive templates written in the GCode Template Language (GTL); see
  # docs/gcode-template-language.md for the full grammar.
  #
  # Emit vs script:
  #   - A line whose first non-whitespace character is a backtick (`) emits
  #     GCode. Every other line is Rhai script (loops, conditionals, variables).
  #   - Inside an emit line, {expr} is evaluated in scope and spliced in,
  #     converted to the active output unit. Example:  `G0 X{x} Y{y}
  #   - Braces delimit, so no spaces are needed between fields: `X{x}Y{y}`.
  #     A literal brace is doubled: {{ or }}.
  #
  # Unit model:
  #   - Call metric() (emits G21) or imperial() (emits G20), normally once in
  #     initialise. That call fixes how every later value is formatted and
  #     mirrors the machine's own modal state, so the author never tracks units.
  #   - Display precision follows the active unit system automatically.
  #   - Values keep their unit type in script logic, so `z - z_retract` and
  #     `z > z_bottom` are unit-correct; conversion to a number happens only at
  #     emit. Force a specific unit with an accessor: {z_safe.mm}, {z_safe.inch}.
  #     max/min/abs/clamp work on them too.
  #   - A measurement cannot be compared with a bare number: `z > 5` is an error
  #     (five what?). Write `z > z_bottom`, or name the unit: `z.mm > 5`.
  #
  # Example (a multi-pass depth loop, e.g. cutting to depth in steps). Every name
  # here is one the `drill` primitive declares below — a template may only use the
  # variables listed for the primitive it belongs to:
  #
  #     `G0 X{x} Y{y}
  #     `G0 Z{z_retract}
  #     let z = z_retract;
  #     let step = (z_retract - z_bottom) / 3;
  #     while z > z_bottom {
  #         z = max(z - step, z_bottom);
  #         `G1 Z{z} F{z_feedrate}
  #         `G0 Z{z_retract}
  #     }
  #
  # Notes:
  #   - These templates are strings; this schema validates their presence and
  #     type, not whether each script is semantically valid. The application
  #     compiles/evaluates them separately when loading or editing the profile.
  #
  primitives:
    description: Primitive templates in the GCode Template Language (backtick lines emit GCode; other lines are Rhai script). See docs/gcode-template-language.md.
    type: object
    properties:

      # Program initialization block.
      #
      # Expected placeholders include:
      #   {pcb_filename}
      #   {timestamp}
      #   {z_safe}
      #
      # Calls metric() to establish millimetre output (emits G21) before any
      # coordinate is emitted.
      #
      initialise:
        description: Program initialization block.
        type: string
        # Additional variables in scope for this primitive's GTL, beyond the shared
        # emit/fmt()/metric() surface. Read by the primitive editor's reference panel
        # and its validate/preview (the generation scopes are built to match).
        x-variables:
          - { name: pcb_filename, type: string, description: "Source KiCad PCB file name." }
          - { name: timestamp, type: string, description: "Program generation time (local clock)." }
          - { name: z_safe, type: length, description: "Safe Z height to retract to, clear of the work and fixtures." }
          - { name: origin_reference, type: string, description: "How the step fixture's zero is identified on this machine, as the operator entered it (e.g. 'G54', 'G54.1 P7'). Normally emitted by calling set_origin(), which validates it first; this raw value is here for a template that needs it verbatim. Do not do both, or the origin is emitted twice." }
        default: |
          `(Created by kicad2gcode from '{pcb_filename}' - {timestamp})
          `(Reset all back to safe defaults)
          `G17 G40 G49 G80 G90
          set_origin();
          metric();
          `G10 P0
          `(Establish the Z-Safe)
          `G0 Z{z_safe}

      # Rapid positioning move primitive.
      #
      # Expected placeholders include:
      #   {x}
      #   {y}
      #   {z}
      #
      rapid_move:
        description: Positioning move primitive. Takes x, y, and z.
        type: string
        x-variables:
          - { name: x, type: length, description: "Target X coordinate." }
          - { name: y, type: length, description: "Target Y coordinate." }
          - { name: z, type: length, description: "Target Z coordinate." }
        default: "`G0 X{x} Y{y} Z{z}"

      # Linear cutting move primitive.
      #
      # Expected placeholders include:
      #   {x}
      #   {y}
      #   {z}
      #   {feedrate}
      #   {s}
      #
      # The template MUST emit a feed word. A G1 with no F runs at whatever feed is
      # modal — after a drill cycle that is the drill's plunge feed, which is not a
      # feed a router should ever see.
      #
      linear_cut:
        description: Linear cutting primitive. Takes x, y, z, and feedrate.
        type: string
        x-variables:
          - { name: x, type: length, description: "Target X coordinate." }
          - { name: y, type: length, description: "Target Y coordinate." }
          - { name: z, type: length, description: "Target Z coordinate." }
          - { name: feedrate, type: feed, description: "Feed for this move: the derated plunge feed when it enters the material, the lateral cutting feed otherwise. The application chooses which." }
          - { name: s, type: rpm, description: "Spindle speed, for controllers that want it restated on the cut line. Normally already set by start_spindle." }
        default: "`G1 X{x} Y{y} Z{z} F{feedrate}"

      # Start spindle primitive.
      #
      # Expected placeholders include:
      #   {rpm}
      #
      start_spindle:
        description: Start spindle primitive.
        type: string
        x-variables:
          - { name: rpm, type: rpm, description: "Spindle speed to command." }
        default: |
          `S{rpm}
          `M03

      # Stop spindle primitive.
      #
      stop_spindle:
        description: Stop spindle primitive.
        type: string
        x-variables: []
        default: "`M05"

      # Drill cycle primitive.
      #
      # Expected placeholders include:
      #   {x}
      #   {y}
      #   {z_bottom}
      #   {z_retract}
      #   {z_feedrate}
      #
      drill:
        description: Drill primitive template.
        type: string
        x-variables:
          - { name: x, type: length, description: "Hole X coordinate." }
          - { name: y, type: length, description: "Hole Y coordinate." }
          - { name: z_bottom, type: length, description: "Z depth at the bottom of the hole." }
          - { name: z_retract, type: length, description: "Z retract (R plane) between holes." }
          - { name: z_feedrate, type: feed, description: "Plunge feed rate." }
        default: "`G81 X{x} Y{y} Z{z_bottom} R{z_retract} F{z_feedrate}"

      # Arc cutting primitive.
      #
      # Expected placeholders include:
      #   {clockwise}
      #   {x}
      #   {y}
      #   {i}
      #   {j}
      #   {xy_feedrate}
      #
      # Direction arrives as a BOOLEAN, not as a ready-made word: the application
      # decides which way the cutter goes round, the profile decides what that is
      # called. GTL has no ternary, so the idiom is a Rhai if-expression:
      #
      #   {if clockwise { "G2" } else { "G3" }}
      #
      cut_arc:
        description: Arc cutting primitive template.
        type: string
        x-variables:
          - { name: clockwise, type: boolean, description: "True when the arc turns clockwise (conventionally G2), false counter-clockwise (G3). Use: {if clockwise { \"G2\" } else { \"G3\" }}." }
          - { name: x, type: length, description: "Arc end-point X coordinate." }
          - { name: y, type: length, description: "Arc end-point Y coordinate." }
          - { name: i, type: length, description: "Arc centre X offset from the start point." }
          - { name: j, type: length, description: "Arc centre Y offset from the start point." }
          - { name: xy_feedrate, type: feed, description: "Cutting feed rate in the XY plane." }
        default: "`{if clockwise { \"G2\" } else { \"G3\" }} X{x} Y{y} I{i} J{j} F{xy_feedrate}"

      # Bezier cutting primitive.
      #
      # May be native GCode for a controller that supports it, or a placeholder
      # for expansion into arcs/segments by the application.
      #
      cut_bezier:
        description: Bezier primitive template. May be native or an approximation sequence.
        type: string
        x-variables: []
        default: |
          `; cut_bezier fallback
          `; implementation may expand into one or more arc segments

      # Tool change primitive.
      #
      # Expected placeholders include:
      #   {manual_message}
      #   {slot}
      #   {rpm}
      #
      # This primitive stops the spindle, prompts if the change is manual, and swaps
      # the tool. It should NOT set the speed: `start_spindle` is always emitted
      # immediately after it and opens with `S{rpm}`, so an `S` here is unconditionally
      # redundant and shows up as two identical S words in a row. `rpm` stays available
      # for a controller that genuinely wants the speed programmed before `M06`.
      change_tool:
        description: Tool change primitive template.
        type: string
        x-variables:
          - { name: manual_message, type: string, description: "Operator prompt shown for a manual tool change." }
          - { name: slot, type: integer, description: "Target tool/rack slot number." }
          - { name: rpm, type: rpm, description: "Spindle speed for the block. Normally left to start_spindle, which follows immediately; use it only if the controller needs S before M06." }
        default: |
          `M05
          `{manual_message}
          `T{slot} M06

      # Selects the machine's work origin — the stored zero the step's fixture sits in.
      #
      # Called as `set_origin();` from `initialise` (or `conclude`), NOT rendered in
      # place: like metric()/imperial() it is a registered function, and what it emits
      # is this template, rendered once before any G-code exists. So a `throw` here
      # refuses the whole program rather than truncating one halfway through.
      #
      # This primitive owns the answer to "which origins does this controller have?",
      # because that is a machine fact and only the CNC profile knows it. The fixture
      # supplies `origin_reference` as the operator typed it; this normalises it (trim,
      # upper-case, strip spaces) and rejects anything the machine cannot honour. An
      # unchecked reference is the dangerous case: an offset the controller does not
      # have leaves the job running against whatever origin is currently active, which
      # cuts the board in the wrong place and reports nothing.
      #
      # The default below is the conservative six — every G-code controller has those.
      # A machine with more (a MASSO's `G54.1 P1..P100`) or fewer (a Bantam, whose G54
      # is reserved for its own reference) says so in its own profile.
      #
      set_origin:
        description: >-
          Validates and emits the work-origin selection for this machine. Called as
          set_origin() from initialise; throws to refuse generation when the fixture's
          origin reference is blank or is not an offset this controller has.
        type: string
        x-variables:
          - { name: origin_reference, type: string, description: "The step fixture's Machine Origin Reference, exactly as the operator entered it — unnormalised, so this template can report the original text in an error." }
        default: |
          let key = origin_reference;
          key.trim();
          key.make_upper();
          key.replace(" ", "");
          if key.is_empty() {
              throw "the fixture has no origin reference. Leaving it blank would run " +
                    "the job against whatever origin the controller happens to have " +
                    "active. Set it to one of: G54 G55 G56 G57 G58 G59.";
          }
          let valid = [];
          for n in 54..=59 { valid.push("G" + n); }
          if !valid.contains(key) {
              throw "'" + origin_reference + "' is not a valid origin reference for " +
                    "this machine. This controller has six work coordinate systems: " +
                    "G54 G55 G56 G57 G58 G59. Extended offsets (G54.1 P...) are not " +
                    "available.";
          }
          `{key}

      # Program finalization block.
      #
      conclude:
        description: Program conclude/finalization block.
        type: string
        # Same program-layer values as `initialise`: the footer commonly retracts
        # to `z_safe` and may echo the source file / timestamp. Generation builds
        # the conclude scope to match this list (see src/runtime/generation.rs).
        x-variables:
          - { name: pcb_filename, type: string, description: "Source KiCad PCB file name." }
          - { name: timestamp, type: string, description: "Program generation time (local clock)." }
          - { name: z_safe, type: length, description: "Safe Z height to retract to, clear of the work and fixtures." }
          - { name: origin_reference, type: string, description: "How the step fixture's zero is identified on this machine — for a footer that reselects it before parking. Prefer calling set_origin(), which validates it first." }
        default: |
          `(end of file)
          `G0 Z{z_safe}
          `G0 X0 Y0

      # Optional pause/message primitive.
      #
      # Expected placeholders include:
      #   {message}
      #
      pause:
        description: Optional pause/message insertion primitive.
        type: string
        x-variables:
          - { name: message, type: string, description: "Message shown to the operator at the pause." }
        default: |
          `MSG {message}
          `M01

      # Optional comment/banner primitive.
      #
      # Expected placeholders include:
      #   {text}
      #
      banner:
        description: Optional comment/banner insertion primitive.
        type: string
        x-variables:
          - { name: text, type: string, description: "Banner/comment text to insert." }
        default: "`( {text} )"

      # How this machine is told which unit system to work in.
      #
      # Rendered by the `metric()` / `imperial()` calls a template makes — those set
      # how every later value is formatted, and emit this. The two halves are one
      # call on purpose: a profile that emitted G20 while the engine formatted in
      # millimetres would cut inch-mode geometry from metric numbers, silently.
      #
      # This exists so no GCode word is built into the application. The default is
      # the usual G21/G20 pair, but a machine that has no unit statement leaves it
      # empty, and a controller that spells it some other way says so here.
      #
      # `metric` is the boolean to branch on; `unit` is the same choice as a string
      # ("metric" / "imperial") for a dialect that needs more than two branches.
      #
      set_unit:
        description: >-
          How the machine is told which unit system to work in, emitted by a
          template's metric()/imperial() call. Empty for a machine with no unit
          statement.
        type: string
        x-variables:
          - { name: metric, type: boolean, description: "True for millimetres, false for inches." }
          - { name: unit, type: string, description: "The same choice as a string: \"metric\" or \"imperial\"." }
        default: '`{if metric { "G21" } else { "G20" }}'

      # Optional line-number primitive.
      #
      # Expected placeholders include:
      #   {line}, {text}
      #
      # Emitted as a PREFIX to each program line, so it must not end the line:
      # close the template with a backtick, which suppresses the newline and keeps
      # the separating space inside the delimiters where an editor cannot trim it.
      #
      #   line_number: "`N{line * 10} `"
      #
      # `line` counts from 1 over the program's non-blank lines. Absent or empty
      # means no numbering at all — which is what replaced the former
      # `machine.line_numbering_increment`, whose value now lives in the template's
      # own arithmetic. Numbering is a whole-program pass, so this is applied after
      # the program is assembled, not by the primitives that build it.
      #
      # `text` is the line about to be numbered, so the template can decide *whether*
      # to number as well as how. Emitting nothing leaves that line unnumbered — how a
      # profile skips its comments:
      #
      #   line_number: |
      #     if !text.starts_with("(") {
      #         `N{line * 10} `
      #     }
      #
      line_number:
        description: >-
          Optional per-line number prefix. Absent or empty means the program is not
          numbered. End the template with a backtick so no newline is emitted.
        type: string
        x-variables:
          - { name: line, type: integer, description: "1-based index of the program line being numbered, counting non-blank lines only." }
          - { name: text, type: string, description: "The program line about to be numbered — emit nothing to leave it unnumbered (e.g. comments)." }
        default: ""

    required:
      - initialise
      - rapid_move
      - linear_cut
      - start_spindle
      - stop_spindle
      - drill
      - cut_arc
      - cut_bezier
      - change_tool
      - conclude

    additionalProperties: false

required:
  - id
