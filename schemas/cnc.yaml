$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "cnc.yaml"
x-schema-version: 1

title: CNC Profile
description: >
  CNC profile persisted configuration. This file controls the emitted GCode
  for a CNC machine. The `primitives` templates are written in the GCode
  Template Language (GTL): a line starting with a backtick emits GCode, every
  other line is Rhai script, and `{expr}` inside an emit line is evaluated and
  unit-converted. See docs/gcode-template-language.md for the full grammar.

  This schema references shared UUID and unit definitions from files located in
  the same directory:
    - id.yaml
    - units.yaml

type: object

properties:

  # Version of this schema
  schema_version:
    type: integer
    const: 1
    description: Schema/data format version for this file.

  # ---------------------------------------------------------------------------
  # id
  # ---------------------------------------------------------------------------
  # Stable unique CNC profile identifier.
  #
  # Uses the shared UUIDv7 validator from id.yaml.
  #
  # Valid example:
  #   id: "01890fdb-4daf-7a37-8f6a-9dc397e5b4ef"
  #
  id:
    description: Unique CNC profile ID.
    $ref: "id.yaml#/$defs/uuid_v7"

  # ---------------------------------------------------------------------------
  # name
  # ---------------------------------------------------------------------------
  # Human-readable CNC profile name.
  #
  # Valid examples:
  #   name: "Genmitsu 3018-Pro"
  #   name: "Masso G3 - With ATC"
  #
  name:
    description: User-facing CNC profile name.
    type: string
    minLength: 1
    default: "My CNC profile"

  # ---------------------------------------------------------------------------
  # machine
  # ---------------------------------------------------------------------------
  # Physical machine configuration.
  #
  machine:
    description: Physical machine configuration.
    type: object
    properties:

      # -----------------------------------------------------------------------
      # spindle_rpm_min
      # -----------------------------------------------------------------------
      # Minimum spindle speed. Unit is optional and defaults to RPM in the
      # application.
      #
      # Valid examples:
      #   spindle_rpm_min: 1000
      #   spindle_rpm_min: "1000"
      #   spindle_rpm_min: "1000 rpm"
      #   spindle_rpm_min: "1000rpm"
      #
      spindle_rpm_min:
        description: Minimum spindle speed. Bare numbers are interpreted as rpm.
        default: "10000rpm"
        $ref: "units.yaml#/$defs/rpm"

      # -----------------------------------------------------------------------
      # spindle_rpm_max
      # -----------------------------------------------------------------------
      # Maximum spindle speed. Unit is optional and defaults to RPM in the
      # application.
      #
      # Valid examples:
      #   spindle_rpm_max: 24000
      #   spindle_rpm_max: "24000"
      #   spindle_rpm_max: "24000 rpm"
      #   spindle_rpm_max: "24000rpm"
      #
      spindle_rpm_max:
        description: Maximum spindle speed. Bare numbers are interpreted as rpm.
        default: "24000rpm"
        $ref: "units.yaml#/$defs/rpm"

      # -----------------------------------------------------------------------
      # max_feed_xy
      # -----------------------------------------------------------------------
      # The fastest the machine can actually feed in the XY plane, from its
      # specification — not a preference. A tool rated faster than this is run at a
      # lower spindle speed so its chip load is still met (see max_feed_z).
      #
      # Valid examples:
      #   max_feed_xy: "5000mm/min"
      #   max_feed_xy: "5000 mm/min"
      #   max_feed_xy: "200 ipm"
      #
      max_feed_xy:
        description: >
          Maximum feed rate the machine can sustain in the XY plane. Used to cap
          routing feeds: a tool whose rated feed exceeds it is run at a proportionally
          lower spindle speed rather than simply being fed slower, so feed per
          revolution is preserved.
        default: "5000mm/min"
        $ref: "units.yaml#/$defs/feed"

      # -----------------------------------------------------------------------
      # max_feed_z
      # -----------------------------------------------------------------------
      # The Z axis is usually the slow one, and drilling is *entirely* Z motion, so
      # this is the limit that most often binds. Kept separate from max_feed_xy
      # precisely so a slow Z does not needlessly throttle lateral routing.
      #
      # Valid examples:
      #   max_feed_z: "5000mm/min"
      #   max_feed_z: "1500 mm/min"
      #
      max_feed_z:
        description: >
          Maximum feed rate the machine can sustain on Z. Binds every drilling plunge,
          and the entry plunge of a routing pass. Usually lower than max_feed_xy.
        default: "5000mm/min"
        $ref: "units.yaml#/$defs/feed"

      # -----------------------------------------------------------------------
      # output_file_extension
      # -----------------------------------------------------------------------
      # What a saved program for this machine is called. A machining step names its
      # own CNC, and the CNC's primitives decide the output *format* — a step whose
      # primitives emit Excellon should not be saved as `.nc`.
      #
      # Written without the dot. Valid examples:
      #   output_file_extension: nc
      #   output_file_extension: ngc
      #   output_file_extension: drl
      #
      output_file_extension:
        description: >
          Extension for programs saved for this machine, without the leading dot. The
          CNC's primitives decide the output format, so the extension belongs with them
          rather than with the save dialog.
        type: string
        pattern: '^[A-Za-z0-9]{1,8}$'
        default: "nc"

      # -----------------------------------------------------------------------
      # atc_slot_count
      # -----------------------------------------------------------------------
      # Number of automatic tool changer slots.
      #
      # 0 means ATC is disabled and manual tool change is used.
      #
      # Valid examples:
      #   atc_slot_count: 0
      #   atc_slot_count: 12
      #
      atc_slot_count:
        description: Number of ATC slots. 0 means ATC is disabled.
        type: integer
        minimum: 0
        default: 0

      # -----------------------------------------------------------------------
      # curve_tolerance
      # -----------------------------------------------------------------------
      # How far the emitted path may depart from the true curve.
      #
      # One value governs every approximation, so a profile cannot be accurate in
      # one place and coarse in another:
      #   - fitting arcs to a routed outline (a curved edge becomes G2/G3 rather
      #     than hundreds of tiny G1 moves)
      #   - flattening an arc into straight moves, when cut_arc is blank
      #
      # A machine fact, not a preference: 0.01 mm is right for a PCB router and
      # absurd for a plasma table. Tighter costs program size and nothing else;
      # looser is visible on the cut edge.
      #
      # Valid examples:
      #   curve_tolerance: "0.01mm"
      #   curve_tolerance: "0.5mil"
      #
      curve_tolerance:
        description: >
          Maximum deviation of the emitted path from the true curve. Governs arc
          fitting and arc flattening alike.
        default: "0.01mm"
        $ref: "units.yaml#/$defs/size"

      # -----------------------------------------------------------------------
      # scaling
      # -----------------------------------------------------------------------
      # Axis scaling factors.
      #
      # 1.0 means no scaling.
      #
      scaling:
        description: >
          Axis scaling multipliers. A value of 1.0 means no scaling.
          Values are applied as output = input * scaling.

        type: object
        properties:

          # X axis scaling multiplier.
          #
          # Valid examples:
          #   x: 1.0
          #   x: 0.9995
          #
          x:
            description: X axis scaling multiplier.
            type: number
            default: 1.0

          # Y axis scaling multiplier.
          #
          # Valid examples:
          #   y: 1.0
          #   y: 1.0002
          #
          y:
            description: Y axis scaling multiplier.
            type: number
            default: 1.0

        required: [x, y]
        additionalProperties: false

      # Line numbering was once `line_numbering_increment` here — a bare integer the
      # application turned into "N<n> " itself. That put GCode in the application, and
      # split the format across two places. It is now entirely the
      # `primitives.line_number` template, whose arithmetic carries the increment.
      # Profiles are migrated on load (`normalize_cnc_value` in src/data/mod.rs).

      # -----------------------------------------------------------------------
      # has_repeatable_home
      # -----------------------------------------------------------------------
      # Whether the machine homes to a repeatable machine-coordinate origin.
      #
      # This is the single most important zeroing fact. When true, the work origin
      # can be established once and reused for every job (and the machine-bed height
      # becomes a known coordinate the app can persist), so subsequent runs need no
      # touch-off. When false (the cheapest controllers), the operator must set the
      # work zero on every job.
      #
      # Valid examples:
      #   has_repeatable_home: true
      #   has_repeatable_home: false
      #
      has_repeatable_home:
        description: >
          True if the machine homes to a repeatable machine-coordinate system.
          Enables set-once / persisted work origin and bed reference; false means
          the operator re-establishes the work zero each job.
        type: boolean
        default: false

      # (`work_coordinate_systems` — a count of stored zero points — was retired
      # here. It existed so the planner could refuse a fixture whose *ordinal*
      # exceeded the machine's count, and a fixture no longer holds an ordinal: it
      # names its origin in the machine's own words (`fixture.yaml#/origin_reference`)
      # and the `set_origin` primitive below decides what this controller accepts.
      # A count cannot express `G54.1 P1..P100`, and two places defining validity is
      # how they drift. Retired keys are dropped on load — see `normalize_cnc_value`.)

      # -----------------------------------------------------------------------
      # tool_length_measurement
      # -----------------------------------------------------------------------
      # How the controller establishes each tool's length (its Z offset).
      #
      #   auto_setter — a tool-length probe/setter measures every tool at M06
      #                 automatically (e.g. a MASSO with a tool setter); the
      #                 generated program needs nothing extra for Z per tool.
      #   manual      — the operator sets tool length / re-zeros Z on each tool
      #                 change; the program pauses and prompts.
      #
      # Valid examples:
      #   tool_length_measurement: auto_setter
      #   tool_length_measurement: manual
      #
      tool_length_measurement:
        description: >
          How tool length (the Z offset) is established. 'auto_setter' means a tool
          setter measures each tool automatically at M06; 'manual' means the
          operator re-zeros Z per tool change.
        type: string
        enum: [manual, auto_setter]
        default: manual

    required:
      - spindle_rpm_min
      - spindle_rpm_max
      # Required, but both carry a default, so a profile written before they existed
      # loads with the conservative 5000mm/min filled in rather than being rejected.
      - max_feed_xy
      - max_feed_z
      # Likewise defaulted, so an older profile loads as the G-code machine it was.
      - output_file_extension
      - atc_slot_count
      - scaling

    additionalProperties: false

# ---------------------------------------------------------------------------
  # primitives
  # ---------------------------------------------------------------------------
  # Primitive templates written in the GCode Template Language (GTL); see
  # docs/gcode-template-language.md for the full grammar.
  #
  # Emit vs script:
  #   - A line whose first non-whitespace character is a backtick (`) emits
  #     GCode. Every other line is Rhai script (loops, conditionals, variables).
  #   - Inside an emit line, {expr} is evaluated in scope and spliced in,
  #     converted to the active output unit. Example:  `G0 X{x} Y{y}
  #   - Braces delimit, so no spaces are needed between fields: `X{x}Y{y}`.
  #     A literal brace is doubled: {{ or }}.
  #
  # Unit model:
  #   - Call metric() (emits G21) or imperial() (emits G20), normally once in
  #     initialise. That call fixes how every later value is formatted and
  #     mirrors the machine's own modal state, so the author never tracks units.
  #   - Display precision follows the active unit system automatically.
  #   - Values keep their unit type in script logic, so `z - z_retract` and
  #     `z > z_bottom` are unit-correct; conversion to a number happens only at
  #     emit. Force a specific unit with an accessor: {z_safe.mm}, {z_safe.inch}.
  #     max/min/abs/clamp work on them too.
  #   - A measurement cannot be compared with a bare number: `z > 5` is an error
  #     (five what?). Write `z > z_bottom`, or name the unit: `z.mm > 5`.
  #
  # Example (a multi-pass depth loop, e.g. cutting to depth in steps). Every name
  # here is one the `drill` primitive declares below — a template may only use the
  # variables listed for the primitive it belongs to:
  #
  #     `G0 X{x} Y{y}
  #     `G0 Z{z_retract}
  #     let z = z_retract;
  #     let step = (z_retract - z_bottom) / 3;
  #     while z > z_bottom {
  #         z = max(z - step, z_bottom);
  #         `G1 Z{z} F{z_feedrate}
  #         `G0 Z{z_retract}
  #     }
  #
  # Notes:
  #   - These templates are strings; this schema validates their presence and
  #     type, not whether each script is semantically valid. The application
  #     compiles/evaluates them separately when loading or editing the profile.
  #
  primitives:
    description: Primitive templates in the GCode Template Language (backtick lines emit GCode; other lines are Rhai script). See docs/gcode-template-language.md.
    type: object
    # ---------------------------------------------------------------------------
    # How to read this section
    # ---------------------------------------------------------------------------
    # Every primitive declares two things about itself, which the CNC editor reads
    # so an author never has to guess how their template gets used:
    #
    #   x-kind      how it is invoked
    #     generator   the application emits it, at a defined point in the program
    #     callable    NOTHING emits it - a template calls it by name, e.g.
    #                 `set_origin();` or `comment("Outline")`. Filling one in and
    #                 not calling it produces no output at all.
    #     filter      applied to every line of the finished program
    #
    #   x-category  where it belongs in the editor
    #     program | tools | motion | drilling | operator | formatting
    #
    #   x-fallback  what a BLANK template falls back to (motion only)
    #     On cut_arc (-> cut_linear). Leaving it blank does not drop the geometry:
    #     a machine with no arc word has its curves cut as straight moves instead,
    #     to machine.curve_tolerance.
    #
    #     This is why blankness cannot be a general rule in the renderer: a blank
    #     tool_measure means "this machine needs no measurement block" and must keep
    #     meaning exactly that. Only a primitive declaring x-fallback is degraded;
    #     every other blank template still emits nothing.
    #
    # The two are independent: `operator` holds three callables, and `program`
    # holds two generators plus two callables. That is simply what is true.
    #
    # Naming: noun-first within a family, so relatives sort together and a name can
    # be guessed - `spindle_start`/`spindle_stop`, `tool_change`/`tool_measure`,
    # `cut_linear`/`cut_arc`, `program_begin`/`program_end`. Profiles
    # written under the old names are migrated on load (`normalize_cnc_value`).
    properties:

      # =======================================================================
      # Program
      # =======================================================================

      # Program header. The first thing emitted, once per step.
      #
      # Conventionally establishes the modal state the rest of the program relies
      # on: call metric() (or imperial()) to fix the unit, and set_origin() to
      # select the fixture's work offset. Neither happens unless this template
      # calls it.
      program_begin:
        description: Program header, emitted once at the top of each step's program.
        type: string
        x-kind: generator
        x-category: program
        # Additional variables in scope for this primitive's GTL, beyond the shared
        # emit/fmt()/metric() surface. Read by the primitive editor's reference panel
        # and its validate/preview (the generation scopes are built to match).
        x-variables:
          - { name: k2g_version, type: string, description: "The version of k2g that produced this program (e.g. \"0.9.0\"). Worth printing in a header: a board that comes back months later can then be traced to the build that machined it." }
          - { name: filename, type: string, description: "Source KiCad PCB file name." }
          - { name: timestamp, type: string, description: "Program generation time (local clock)." }
          - { name: z_safe, type: length, description: "Safe Z height to retract to, clear of the work and fixtures." }
          - { name: origin_reference, type: string, description: "How the step fixture's zero is identified on this machine, as the operator entered it (e.g. 'G54', 'G54.1 P7'). Normally emitted by calling set_origin(), which validates it first; this raw value is here for a template that needs it verbatim. Do not do both, or the origin is emitted twice." }
          - { name: steps, type: list, description: "Every step of the machining profile, in order - not just this one, so a header can say 'step 2 of 3'. Each entry holds the step's own settings (name, side_to_machine, operations, drill_pth, route_board, ...) plus cnc_name / fixture_name / toolset_name beside the ids it binds. Index it with step_index; steps.len() counts them. A list has no printed form - reach a field: steps[step_index].name." }
          - { name: step_index, type: integer, description: "Which step of the machining profile this program is. 0 is the first, so an operator-facing count reads {step_index + 1} of {steps.len()}." }
        default: |
          `(Created by kicad2gcode {k2g_version} from '{filename}' - {timestamp})
          `(Reset all back to safe defaults)
          `G17 G40 G49 G80 G90
          set_origin();
          metric();
          `(Establish the Z-Safe)
          `G0 Z{z_safe}

      # Program footer. The last thing emitted, once per step.
      program_end:
        description: Program footer, emitted once at the end of each step's program.
        type: string
        x-kind: generator
        x-category: program
        # Same program-layer values as `program_begin`: the footer commonly retracts
        # to `z_safe` and may echo the source file / timestamp. Generation builds
        # the footer scope to match this list (see src/gcode/program.rs).
        x-variables:
          - { name: k2g_version, type: string, description: "The version of k2g that produced this program (e.g. \"0.9.0\"). Worth printing in a header: a board that comes back months later can then be traced to the build that machined it." }
          - { name: filename, type: string, description: "Source KiCad PCB file name." }
          - { name: timestamp, type: string, description: "Program generation time (local clock)." }
          - { name: z_safe, type: length, description: "Safe Z height to retract to, clear of the work and fixtures." }
          - { name: origin_reference, type: string, description: "How the step fixture's zero is identified on this machine - for a footer that reselects it before parking. Prefer calling set_origin(), which validates it first." }
          - { name: steps, type: list, description: "Every step of the machining profile, in order - see program_begin. Useful in a footer to name the step the operator sets up next: steps[step_index + 1].name, guarded by step_index + 1 < steps.len()." }
          - { name: step_index, type: integer, description: "Which step of the machining profile this program is. 0 is the first." }
        default: |
          `(end of file)
          `G0 Z{z_safe}
          `G0 X0 Y0

      # How this machine is told which unit system to work in.
      #
      # CALLABLE: rendered by the `metric()` / `imperial()` calls a template makes.
      # Those set how every later value is formatted AND emit this. The two halves
      # are one call on purpose: a profile that emitted G20 while the engine
      # formatted in millimetres would cut inch-mode geometry from metric numbers,
      # silently.
      #
      # This exists so no GCode word is built into the application. The default is
      # the usual G21/G20 pair, but a machine that has no unit statement leaves it
      # empty, and a controller that spells it some other way says so here.
      #
      # `metric` is the boolean to branch on; `unit` is the same choice as a string
      # ("metric" / "imperial") for a dialect that needs more than two branches.
      set_unit:
        description: >-
          How the machine is told which unit system to work in. Called as metric()
          or imperial() from another template - nothing emits it on its own. Empty
          for a machine with no unit statement.
        type: string
        x-kind: callable
        x-category: program
        x-variables:
          - { name: metric, type: boolean, description: "True for millimetres, false for inches." }
          - { name: unit, type: string, description: "The same choice as a string: \"metric\" or \"imperial\"." }
        default: '`{if metric { "G21" } else { "G20" }}'

      # Selects the machine's work origin - the stored zero the step's fixture sits in.
      #
      # CALLABLE: written as `set_origin();`, normally from `program_begin`. It is not
      # rendered in place - like metric()/imperial() it is a registered function, and
      # what it emits is this template, rendered once before any G-code exists. So a
      # `throw` here refuses the whole program rather than truncating one halfway.
      #
      # This primitive owns the answer to "which origins does this controller have?",
      # because that is a machine fact and only the CNC profile knows it. The fixture
      # supplies `origin_reference` as the operator typed it; this normalises it (trim,
      # upper-case, strip spaces) and rejects anything the machine cannot honour. An
      # unchecked reference is the dangerous case: an offset the controller does not
      # have leaves the job running against whatever origin is currently active, which
      # cuts the board in the wrong place and reports nothing.
      #
      # The default below is the conservative six - every G-code controller has those.
      # A machine with more (a MASSO's `G54.1 P1..P100`) or fewer (a Bantam, whose G54
      # is reserved for its own reference) says so in its own profile.
      set_origin:
        description: >-
          Validates and emits the work-origin selection for this machine. Called as
          set_origin() from program_begin - nothing emits it on its own. Throws to
          refuse generation when the fixture's origin reference is blank or is not an
          offset this controller has.
        type: string
        x-kind: callable
        x-category: program
        x-variables:
          - { name: origin_reference, type: string, description: "The step fixture's Machine Origin Reference, exactly as the operator entered it - unnormalised, so this template can report the original text in an error." }
        default: |
          let key = origin_reference;
          key.trim();
          key.make_upper();
          key.replace(" ", "");
          if key.is_empty() {
              throw "the fixture has no origin reference. Leaving it blank would run " +
                    "the job against whatever origin the controller happens to have " +
                    "active. Set it to one of: G54 G55 G56 G57 G58 G59.";
          }
          let valid = [];
          for n in 54..=59 { valid.push("G" + n); }
          if !valid.contains(key) {
              throw "'" + origin_reference + "' is not a valid origin reference for " +
                    "this machine. This controller has six work coordinate systems: " +
                    "G54 G55 G56 G57 G58 G59. Extended offsets (G54.1 P...) are not " +
                    "available.";
          }
          `{key}

      # =======================================================================
      # Tools and spindle
      # =======================================================================

      # Tool change. Emitted at the start of every tool block.
      #
      # This primitive stops the spindle, prompts if the change is manual, and swaps
      # the tool. It should NOT set the speed: `spindle_start` is always emitted
      # immediately after it and opens with `S{rpm}`, so an `S` here is unconditionally
      # redundant and shows up as two identical S words in a row. `rpm` stays available
      # for a controller that genuinely wants the speed programmed before `M06`.
      tool_change:
        description: Tool change, emitted at the start of every tool block.
        type: string
        x-kind: generator
        x-category: tools
        x-variables:
          - { name: manual_message, type: string, description: "Operator prompt shown for a manual tool change. Empty on an ATC machine." }
          - { name: slot, type: integer, description: "Target tool/rack slot number." }
          - { name: rpm, type: rpm, description: "Spindle speed for the block. Normally left to spindle_start, which follows immediately; use it only if the controller needs S before M06." }
        default: |
          `M05
          `{manual_message}
          `T{slot} M06

      # Tool length measurement, emitted between `tool_change` and `spindle_start`.
      #
      # Only on a machine whose `machine.tool_length_measurement` is `manual`: a
      # controller with an automatic tool setter measures at M06 and needs nothing
      # here, so this is skipped entirely for it. Empty by default, because a
      # measurement cycle is machine-specific and there is no word that is safe to
      # guess - an empty template emits nothing.
      tool_measure:
        description: >-
          Tool length measurement, emitted after tool_change on a machine whose
          tool_length_measurement is 'manual'. Empty (the default) emits nothing.
        type: string
        x-kind: generator
        x-category: tools
        x-variables:
          - { name: slot, type: integer, description: "Tool/rack slot number just loaded." }
          - { name: tool_name, type: string, description: "Display name of the tool, for an operator prompt." }
          - { name: diameter, type: length, description: "Tool diameter, for a prompt or a probe offset." }
        default: ""

      # Start the spindle, emitted immediately after tool_change (and tool_measure).
      spindle_start:
        description: Start the spindle, emitted after the tool change of every tool block.
        type: string
        x-kind: generator
        x-category: tools
        x-variables:
          - { name: rpm, type: rpm, description: "Spindle speed to command." }
        default: |
          `S{rpm}
          `M03

      # Stop the spindle, emitted once at the end of the step's body.
      spindle_stop:
        description: Stop the spindle, emitted once at the end of the step's body.
        type: string
        x-kind: generator
        x-category: tools
        x-variables: []
        default: "`M05"

      # =======================================================================
      # Motion
      # =======================================================================

      # Rapid positioning move.
      move_rapid:
        description: Rapid positioning move. Takes x, y, and z.
        type: string
        x-kind: generator
        x-category: motion
        x-variables:
          - { name: x, type: length, description: "Target X coordinate." }
          - { name: y, type: length, description: "Target Y coordinate." }
          - { name: z, type: length, description: "Target Z coordinate." }
        default: "`G0 X{x} Y{y} Z{z}"

      # Linear cutting move.
      #
      # The template MUST emit a feed word. A G1 with no F runs at whatever feed is
      # modal - after a drill cycle that is the drill's plunge feed, which is not a
      # feed a router should ever see.
      cut_linear:
        description: Linear cutting move. Takes x, y, z, and feedrate.
        type: string
        x-kind: generator
        x-category: motion
        x-variables:
          - { name: x, type: length, description: "Target X coordinate." }
          - { name: y, type: length, description: "Target Y coordinate." }
          - { name: z, type: length, description: "Target Z coordinate." }
          - { name: feedrate, type: feed, description: "Feed for this move: the derated plunge feed when it enters the material, the lateral cutting feed otherwise. The application chooses which." }
          - { name: s, type: rpm, description: "Spindle speed, for controllers that want it restated on the cut line. Normally already set by spindle_start." }
        default: "`G1 X{x} Y{y} Z{z} F{feedrate}"

      # Arc cutting move.
      #
      # Direction arrives as a BOOLEAN, not as a ready-made word: the application
      # decides which way the cutter goes round, the profile decides what that is
      # called. GTL has no ternary, so the idiom is a Rhai if-expression:
      #
      #   {if clockwise { "G2" } else { "G3" }}
      cut_arc:
        description: Arc cutting move.
        type: string
        x-kind: generator
        x-category: motion
        # Leave this blank for a controller with no arc word and every arc is cut as
        # short straight moves instead, to machine.curve_tolerance. Blank does NOT
        # mean "emit nothing" here - see x-fallback in the notes above.
        x-fallback: cut_linear
        x-variables:
          - { name: clockwise, type: boolean, description: "True when the arc turns clockwise (conventionally G2), false counter-clockwise (G3). Use: {if clockwise { \"G2\" } else { \"G3\" }}." }
          - { name: x, type: length, description: "Arc end-point X coordinate." }
          - { name: y, type: length, description: "Arc end-point Y coordinate." }
          - { name: i, type: length, description: "Arc centre X offset from the start point." }
          - { name: j, type: length, description: "Arc centre Y offset from the start point." }
          - { name: xy_feedrate, type: feed, description: "Cutting feed rate in the XY plane." }
        default: "`{if clockwise { \"G2\" } else { \"G3\" }} X{x} Y{y} I{i} J{j} F{xy_feedrate}"

      # =======================================================================
      # Drilling
      # =======================================================================

      # One hole. Emitted once per hole in a drill block.
      #
      # `index` and `count` describe the hole's place in that block's run of holes,
      # which is what lets a profile emit a MODAL cycle - open it on the first hole,
      # give bare coordinates for the rest, cancel it on the last:
      #
      #   if index == 0 {
      #       `G81 X{x} Y{y} Z{z_bottom} R{z_retract} F{z_feedrate}
      #   } else {
      #       `X{x} Y{y}
      #   }
      #   if index == count - 1 {
      #       `G80
      #   }
      #
      # A block with one hole therefore emits the cycle and cancels it immediately,
      # which is correct rather than a special case.
      drill:
        description: One hole of a drill block. Takes position, depths, feed, and its place in the block.
        type: string
        x-kind: generator
        x-category: drilling
        x-variables:
          - { name: x, type: length, description: "Hole X coordinate." }
          - { name: y, type: length, description: "Hole Y coordinate." }
          - { name: z_bottom, type: length, description: "Z depth at the bottom of the hole." }
          - { name: z_retract, type: length, description: "Z retract (R plane) between holes." }
          - { name: z_feedrate, type: feed, description: "Plunge feed rate." }
          - { name: index, type: integer, description: "This hole's position in the block's run of holes, counting from 0. Use `index == 0` to open a modal cycle." }
          - { name: count, type: integer, description: "How many holes this block drills. Use `index == count - 1` to cancel a modal cycle on the last one." }
        default: "`G81 X{x} Y{y} Z{z_bottom} R{z_retract} F{z_feedrate}"

      # =======================================================================
      # Operator
      # =======================================================================
      #
      # All three are CALLABLE with a text argument, from any template:
      #
      #   comment("Outline pass");
      #   message("Check the vacuum");
      #   pause("Fit the 2mm cutter, then resume");
      #
      # Nothing emits them on its own. They exist so a profile can annotate or
      # interrupt its own output in its own dialect - the application supplies no
      # wording and chooses no placement.

      # A comment line. Annotation only; the machine does nothing with it.
      comment:
        description: >-
          A comment line. Called as comment("text") from another template - nothing
          emits it on its own.
        type: string
        x-kind: callable
        x-category: operator
        x-variables:
          - { name: text, type: string, description: "The comment text, as passed to comment(...)." }
        default: "`( {text} )"

      # A message to the operator that does NOT stop the program.
      message:
        description: >-
          Show text to the operator without stopping. Called as message("text") from
          another template - nothing emits it on its own.
        type: string
        x-kind: callable
        x-category: operator
        x-variables:
          - { name: text, type: string, description: "The message text, as passed to message(...)." }
        default: "`MSG {text}"

      # A message that stops the program until the operator resumes it.
      pause:
        description: >-
          Show text and wait for the operator to resume. Called as pause("text") from
          another template - nothing emits it on its own.
        type: string
        x-kind: callable
        x-category: operator
        x-variables:
          - { name: text, type: string, description: "The prompt shown at the stop, as passed to pause(...)." }
        default: |
          `MSG {text}
          `M01

      # =======================================================================
      # Output formatting
      # =======================================================================

      # Rewrites every line of the finished program.
      #
      # A FILTER, not a generator: it receives each line and emits the line that
      # replaces it, so it owns the whole line and not just a prefix. Emitting
      # nothing DROPS that line, which is how a profile suppresses one.
      #
      #   line_format: "`N{(index + 1) * 10} {text}"        -> N10 G0 X1 Y2
      #
      # Leave it empty for no formatting at all - the program is then emitted exactly
      # as the generators built it. This replaced the former
      # `machine.line_numbering_increment`, whose value now lives in the template's
      # own arithmetic.
      #
      # Because the template decides *whether* as well as *how*, a profile can leave
      # its comments unnumbered:
      #
      #   line_format: |
      #     if text.starts_with("(") {
      #         `{text}
      #     } else {
      #         `N{(index + 1) * 10} {text}
      #     }
      #
      # A template that never mentions `text` emits line numbers and throws the
      # G-code away. `normalize_cnc_value` warns about exactly that on load.
      line_format:
        description: >-
          Rewrites every line of the finished program - it emits the WHOLE line, not a
          prefix. Empty means the program is emitted unchanged; emitting nothing for a
          line drops it.
        type: string
        x-kind: filter
        x-category: formatting
        x-variables:
          - { name: index, type: integer, description: "This line's position in the program, counting non-blank lines from 0." }
          - { name: text, type: string, description: "The line as the generators produced it. Emit it, or the G-code is lost." }
        default: ""

    required:
      - program_begin
      - move_rapid
      - cut_linear
      - spindle_start
      - spindle_stop
      - drill
      - cut_arc
      - tool_change
      - program_end

    additionalProperties: false

required:
  - id
  - name
  - machine
  - primitives

additionalProperties: false
