$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "machining.yaml"
x-schema-version: 3
type: object

# ---------------------------------------------------------------------------
# A machining profile is an ORDERED SEQUENCE OF STEPS. Each step is one
# physical machining setup — its own CNC, fixture, toolset and the operations
# (primitives) run in that setup — so a profile can describe a whole process
# such as: drill locating+PTH  (setup 1)  → drill NPTH+route (setup 2, on a
# possibly different machine/fixture). See docs/architecture.md.
#
# Prior versions (schema_version 2) stored a single flat setup at the top
# level. Those files are migrated on load into a one-step profile (see
# `normalize_machining_value` in src/data/mod.rs).
# ---------------------------------------------------------------------------

$defs:
  # Ordered by how often a step uses them — almost every job drills PTH, most also
  # drill NPTH, many cut the outline; locating pins and engraving are the exceptions.
  # The UI shows them in this order and persists the enabled set in it.
  #
  # ONE CLAIM PER BOARD FACE. Every key here except `drill_locating_pins` may appear
  # in at most one step per face: each removes material the board has once, so a
  # second step claiming it repeats the cut rather than adding work. The rule is per
  # *face* — milling the front then the back is two real jobs — and
  # `drill_locating_pins` is exempt because pins register the board against a fixture,
  # so re-fixturing legitimately drills another set.
  #
  # This is not expressible in JSON Schema (it constrains steps against each other),
  # so it lives in `src/data/model/operations.rs`, which mirrors this list and is what
  # both the editor and the readiness gate consult. Keep the two in step — a test
  # asserts they match, in order.
  operation_key:
    type: string
    enum:
      - drill_pth
      - drill_npth
      - route_board
      - route_cutouts
      - drill_locating_pins
      - engrave_copper

  allowance:
    description: >-
      Tolerance band for substituting a stock tool for a required hole size: a
      relative fraction of the hole diameter, capped by an absolute maximum.
      Effective allowance = min(relative × hole_diameter, max).
    type: object
    default:
      relative: 8%
      max: 0.10mm
    properties:
      relative:
        $ref: "units.yaml#/$defs/percent"
        default: 8%
      max:
        $ref: "units.yaml#/$defs/size"
        default: 0.10mm
    required: [relative, max]
    additionalProperties: false

  drill_holes_common:
    type: object
    default:
      holes:
        route_fallback: true
        drill_first: true
        pilot: false
        oblong: drill_ends_then_route
        oversize:
          relative: 8%
          max: 0.10mm
        undersize:
          relative: 6%
          max: 0.08mm
    properties:
      holes:
        type: object
        default:
          route_fallback: true
          drill_first: true
          pilot: false
          oblong: drill_ends_then_route
          oversize:
            relative: 8%
            max: 0.10mm
          undersize:
            relative: 6%
            max: 0.08mm
        properties:
          # ON by default: an oversized hole (or one whose drill point would reach the
          # bed) is milled with a router instead of erroring. The Tooling tab shows each
          # routed hole, so this is transparent, not silent.
          route_fallback: { type: boolean, default: true }
          drill_first: { type: boolean, default: true }
          pilot: { type: boolean, default: false }
          # Diameter substitution tolerances applied to EVERY hole (round and
          # oblong alike), not just the oblong strategy below. They bound how far a
          # stock drill may differ from the requested finished size. Listed before
          # `oblong` so they don't read as belonging to the oblong-only option.
          oversize:
            title: Oversize allowance (all holes)
            $ref: "#/$defs/allowance"
            default:
              relative: 8%
              max: 0.10mm
          undersize:
            title: Undersize allowance (all holes)
            $ref: "#/$defs/allowance"
            default:
              relative: 6%
              max: 0.08mm
          # Applies ONLY to oblong (slotted) holes: how a slot longer than it is
          # wide is produced. Round holes ignore this.
          oblong:
            title: Oblong hole strategy
            type: string
            default: drill_ends_then_route
            enum: [route, drill_ends_then_route, drill_chain, drill_chain_then_route]
            x-enum-labels:
              [
                "Route the slot",
                "Drill the ends, then route",
                "Overlapping drill chain",
                "Drill chain, then route",
              ]
        additionalProperties: false
    required: [holes]
    additionalProperties: false

  # ---------------------------------------------------------------------------
  # retention — how a through-cut contour holds on until the operator breaks it
  # out. The board's own boundary; a cutout's slug is held by `route_cutouts`,
  # which does not offer the choice (a slug is held or it is a projectile).
  #
  # `mouse_bites` is a property OF a tab, not an alternative to one: a mouse bite
  # is a tab perforated so it snaps cleanly and files down to nothing. (It was
  # once two more `mode` values, which read as though a board could be held by
  # mouse bites alone, all the way round — which is not a thing.)
  #
  # How many holes perforate a tab is deliberately NOT a setting: it follows from
  # the tab width and the drill, at a pitch of twice the drill diameter.
  # ---------------------------------------------------------------------------
  retention:
    type: object
    default:
      mode: tabs
      count: 4
      width: 2.0mm
      mouse_bites: false
    properties:
      mode:
        description: >-
          `tabs` leaves short bridges of material so the part cannot move under
          the cutter. `none` cuts it free in one pass — correct only when
          something else holds it down (tape, a vacuum bed).
        type: string
        default: tabs
        enum: [none, tabs]
      count:
        description: >-
          How many tabs to place when the job does not position them itself.
          They are shared out over the outline's straight sides, longest first.
        type: integer
        minimum: 0
        default: 4
        x-show-when: { mode: [tabs] }
      width:
        description: >-
          How much board each tab leaves standing. The **material**, not the gap
          between the two cuts: the channel is a whole kerf wider than this,
          because the cutter takes half of one out of each end of the tab as it
          stops. So a 2mm tab behind a 2mm cutter opens a 4mm gap in the
          toolpath and leaves 2mm of board in the middle of it.
        $ref: "units.yaml#/$defs/size"
        default: 2.0mm
        x-show-when: { mode: [tabs] }
      mouse_bites:
        description: >-
          Perforate each tab with a row of small drills so it snaps cleanly and
          leaves a much smaller nib than a solid tab. The holes are drilled while
          the board is still whole.

          Spaced a drill's width apart, and kept a drill's width clear of the cut
          at each end — so a tab needs three times the drill diameter before it
          can take even one hole. A tab narrower than that is left solid and the
          step says so.
        type: boolean
        default: false
        x-show-when: { mode: [tabs] }
    required: [mode]
    additionalProperties: false

  route_board:
    type: object
    default:
      outline:
        cut: route
        retention: { mode: tabs, count: 4, width: 2.0mm, mouse_bites: false }
      kerf: 2.0mm
      finishing: 0.1mm
    properties:
      # The board's own boundary.
      outline:
        type: object
        default:
          cut: route
          retention: { mode: tabs, count: 4, width: 2.0mm, mouse_bites: false }
        properties:
          # `mill` is accepted and currently emits exactly what `route` does: both
          # plan one contour offset by the cutter radius, and no area-clearing
          # strategy has been built. It is kept because it is what a step migrated
          # from the retired `mill_board` operation lands on, and because it says
          # what the operator asked for when there is one to honour.
          #
          # `score` and `vgroove` are declared and NOT planned: a step set to
          # either produces no outline pass at all — not a shallower one — and says
          # so in the step's notes (`machining_plan.rs`). They still require the
          # kerf router, which is worth knowing before choosing one.
          cut:
            description: >-
              How the boundary is made. `route` and `mill` cut right through, so
              the board needs retaining, and are currently identical. `score` and
              `vgroove` are not yet planned and produce no outline pass.
            type: string
            default: route
            enum: [route, mill, score, vgroove]
            x-enum-labels: [Route, Mill, Score, V-groove]
          # Only meaningful when `cut: vgroove`; ignored otherwise. It carries a
          # default and — like every per-operation field — is always materialised
          # by the loader (see the note at the foot of this file), so it must NOT
          # be gated behind a conditional-presence rule: an `if cut != vgroove then
          # vgroove_depth absent` constraint would fail against the materialised
          # default on every non-vgroove outline. `x-show-when` hides it in the UI
          # instead, which is a display rule and costs validation nothing.
          vgroove_depth:
            $ref: "units.yaml#/$defs/percent_50_100"
            default: 80%
            x-show-when: { cut: [vgroove] }
          retention:
            $ref: "#/$defs/retention"
            default: { mode: tabs, count: 4, width: 2.0mm, mouse_bites: false }
            x-show-when: { cut: [route, mill] }
        required: [cut]
        additionalProperties: false

      # There was a `cutouts: {enabled, retention}` block here, and this operation
      # cut the interior openings with the edge kerf when it was on. It is gone:
      # `route_cutouts` cuts them, with a cutter chosen to fit each opening rather
      # than the one the boundary asked for, and with the slug held and the sharp
      # corners relieved — none of which this operation could do. Two ways to cut
      # the same opening meant a flag on each to stop them both doing it, and an
      # operator who could turn both off and lose the openings silently.
      #
      # `normalize_edge_block` drops the block from a profile that still carries it
      # (`additionalProperties: false` would otherwise refuse the file). The
      # openings are then cut by adding `route_cutouts` to the step, and the
      # outline pass says so when a board has openings and the step does not.

      # -----------------------------------------------------------------------
      # kerf — the width of the channel routed around the board, and therefore
      # the diameter of the cutter that routes it.
      #
      # A single-pass route removes exactly one cutter width of material, so the
      # kerf IS the cutter: asking for a 2mm kerf is asking for a 2mm router.
      # It is matched **exactly**, and a step with no such router in stock fails
      # rather than quietly cutting a narrower channel — the same rule locating
      # pins follow, and for the same reason. A kerf is a dimension of the
      # finished job, not a preference: a board cut with a 1.6mm channel where
      # 2mm was specified is a different board.
      #
      # Before this existed the cutter was "the smallest router in stock", which
      # is a fine default for reaching tight internal corners and a poor one for
      # an edge cut — it loaded a 0.8mm cutter to do a job a 2mm cutter does in
      # a fraction of the time, with nothing the operator could set to say
      # otherwise.
      #
      # The boundary only. Interior openings are `route_cutouts`' business and
      # take a cutter chosen to fit each one, which is why this kerf can be
      # matched exactly without a 1.5mm opening becoming uncuttable.
      #
      # 2mm by default: a common PCB routing cutter, stiff enough to cut an
      # outline quickly and small enough to get round the corners of most
      # boards.
      # -----------------------------------------------------------------------
      kerf:
        title: Edge routing kerf
        description: >-
          Width of the channel routed around the board, which is also the
          diameter of the cutter that routes it. Matched exactly — a step with
          no router this size cannot run. A finishing allowance widens the
          channel by its own amount, on the waste side.
        $ref: "units.yaml#/$defs/size"
        default: 2.0mm

      # Material left for a final full-depth pass, cleaning up the roughing cut.
      # A length rather than a flag plus a length: 0 means no finishing pass, so
      # one field carries both the decision and the amount.
      #
      # What it actually plans, with cutter radius R and allowance f:
      #
      #   roughing pass  cutter centre at R + f   conventional
      #   finishing pass cutter centre at R       climb
      #
      # so the finished wall is made by a light cut that never sees full
      # engagement. The roughing pass runs the opposite way round on purpose: it
      # is the pass that meets a loaded cutter, and conventional is the more
      # forgiving of the two there, while climb on the finishing pass is what
      # keeps FR4's top copper from lifting. Which direction *is* climb depends on
      # which side of the loop the material is (inside for the board's boundary,
      # outside for a cutout wall), so it is read off the placed geometry rather
      # than set here — the handedness argument is in `src/gcode/routing.rs`, and
      # there was once a `direction: conventional | climb` field, now gone.
      #
      # Two consequences worth knowing:
      #
      #   * The routed **channel** becomes `kerf + finishing` wide, not `kerf`.
      #     The board still comes out at its drawn size — the finishing pass puts
      #     the final wall exactly where a single pass would have — and all the
      #     extra width goes on the waste side.
      #   * The allowance must stay **below the kerf**, or the two passes stop
      #     overlapping and leave a ring of uncut material between them. Well
      #     below it, in practice: this is a spring cut, not a second roughing
      #     pass.
      #
      # This applies to the interior openings as well (`route_cutouts`) — a wall
      # is a wall — with one extra caveat there: a cutout's cutter is chosen to
      # *fit* the opening, and an opening that only just admits it has no room to
      # stand an allowance further in. Such a cutout is cut to size in one pass.
      #
      # It cannot be honoured at all when nothing holds the piece while that wall
      # is cut — `outline.retention.mode: none` for the board, `retain_island:
      # false` for a cutout that leaves a slug. The roughing pass has already cut
      # the piece free by then, so there is no wall left to finish. The planner
      # drops the finishing pass and says so in the step's notes rather than
      # refusing to generate. This cannot be an `x-show-when` — those name a
      # *sibling* key (see `src/ui/show_when.rs`) and the retention mode is two
      # levels away — so the rule is stated here and enforced where it can be
      # explained.
      finishing:
        description: >-
          Material left on the wall for a final light climb pass, after a
          conventional roughing pass one allowance further out. 0 means one pass,
          cut straight to size. Must be smaller than the kerf, and is dropped
          (with a note) when nothing holds the piece while its wall is cut.
        $ref: "units.yaml#/$defs/size"
        default: 0.1mm
    required: [outline]
    additionalProperties: false

  # -------------------------------------------------------------------------
  # route_cutouts — the interior openings, cut on their own terms.
  #
  # `route_board` once cut the boundary and, optionally, the cutouts with ONE
  # cutter: the edge kerf. That is right for the boundary, where the kerf IS a
  # dimension of the finished job and so is matched exactly. It is wrong for a
  # cutout, which is a hole in the middle of the board whose only requirement is
  # that the cutter reaches everywhere the drawing says is gone. A 2mm edge
  # cutter cannot enter a 1.5mm opening, and under `route_board` that opening was
  # reported as vanishing under the kerf rather than cut with the 1mm router
  # already in the rack.
  #
  # So: a separate operation, with a cutter chosen by **fit** rather than by
  # request, plus the two things a cutout needs and a boundary does not — the
  # slug held so the cutter cannot throw it, and the corners relieved because a
  # round cutter cannot cut a sharp one.
  #
  # There is deliberately no kerf and no retention *mode* here. The kerf is not
  # the operator's to choose (the fit decides it), and "no retention" is not a
  # choice worth offering for a slug: it is either held or it is a projectile.
  #
  # This is now the ONLY operation that cuts an interior opening.
  # `route_board`/`mill_board` cut the boundary and nothing else.
  # -------------------------------------------------------------------------
  route_cutouts:
    type: object
    default:
      retain_island: true
      island_tab: 4%
      drill_sharp_corners: true
    properties:
      retain_island:
        title: Hold the slug
        description: >-
          Leave one uncut tab holding the piece of board each cutout removes, so
          the cutter does not throw it. Only an opening wider than twice the
          router diameter leaves a slug at all — a narrower one is cleared
          completely by the single pass round its wall, and has nothing to hold.
        type: boolean
        default: true
      island_tab:
        title: Tab width
        description: >-
          Width of that tab as a fraction of the slug's own perimeter, floored at
          1mm. A fraction rather than a length because the slug's size is the
          board's business, not the profile's: the same profile cuts a 4mm disc
          and a 40mm panel out of the middle of a board, and no one width suits
          both. A tab working out wider than 2mm is perforated automatically —
          past a couple of millimetres a solid tab tears rather than snaps.
        $ref: "units.yaml#/$defs/percent_0_100"
        default: 4%
        x-show-when: { retain_island: [true] }
      drill_sharp_corners:
        title: Relieve sharp corners
        description: >-
          Drill into each corner the round cutter cannot reach, so the corner
          comes out close to sharp instead of filleted to the cutter's radius.
          The hole is tangent to both edges, so it can never cut past what was
          drawn, and it is made in the drill phase while the board is still
          whole. Skipped, with a note, at any corner no drill already in the
          rack suits.
        type: boolean
        default: true
    required: [retain_island]
    additionalProperties: false

  # -------------------------------------------------------------------------
  # engrave_copper — isolation routing: separate the nets by cutting a channel
  # round every piece of copper.
  #
  # The board starts as solid copper and this takes a groove out around each
  # net, leaving its traces standing as islands. So the width is the only thing
  # worth asking about, and depth is *not* asked for at all — but it does not
  # follow from the width alone either.
  #
  # A V-bit's channel is `tip + 2·depth·tan(angle/2)`, and `depth` is measured
  # from the board *surface*: it has to spend the copper thickness before it is
  # cutting a channel at all. So
  #
  #     depth = copper thickness + substrate penetration
  #
  # with the copper read from KiCad's stackup (35um assumed, and said, when the
  # stackup is silent) and the penetration bounded by two global settings. Those
  # bounds are what make the question decidable: the minimum is why a channel is
  # a channel, the maximum is what stops a fine tip being driven a third of the
  # way through the board to reach a width it was never suited to.
  #
  # That is why the width below is a **minimum** rather than a target. Exactly
  # one depth hits any given width, and it is a coincidence when that depth is
  # one the copper and the budget allow. Asking for a floor instead lets the
  # picker take the bit that overshoots least — and the channel it actually
  # cuts is reported in the Tooling table, because it is the number the board's
  # clearances have to accommodate.
  #
  # Where the board is too cramped even for that — two nets closer together
  # than the cut — the pass narrows only across that stretch and says which nets
  # it narrowed, in the step's notes. It can narrow no further than the chosen
  # bit's own minimum-penetration width; copper it cannot separate at all is
  # reported rather than left uncut in silence. It never widens, and it never
  # cuts into a neighbour.
  #
  # Only the outer copper: a mill reaches F.Cu and B.Cu and no others. Which of
  # the two is the step's own `board_face` — and the copper thickness is read
  # for that face, since a two-ounce front over a one-ounce back is a real
  # board.
  # -------------------------------------------------------------------------
  engrave_copper:
    type: object
    default:
      width: 0.25mm
    properties:
      width:
        title: Minimum isolation width
        description: >-
          The narrowest channel to accept between the nets. This is an
          electrical decision, not a tooling one — wider is a better-isolated
          board and a slower, deeper cut. A floor rather than a target: the
          V-bit and its depth are chosen to meet it with the least overshoot the
          stock allows, and the channel actually cut is shown in the Tooling
          table. A width no bit in stock can reach within the substrate
          penetration allowed in Settings is reported rather than approximated.
        $ref: "units.yaml#/$defs/size"
        default: 0.25mm
    required: [width]
    additionalProperties: false

  # -------------------------------------------------------------------------
  # step — one machining setup within the profile's ordered sequence.
  #
  # Each step references **exactly one** CNC, fixture and toolset profile.
  # `$ref` keeps UUIDv7 validation; `x-ref` makes the datastore resolve the
  # value against the target profile collection.
  #
  # These were once a `default` reference plus an array of allowed `choices`,
  # on the assumption that a job would later be able to override a profile's
  # bindings from among the allowed set. That idea was dropped (2026-07-26):
  # a step *is* one physical setup, so a second CNC or fixture for it is a
  # second step, not an alternative. The choices array bought a much heavier
  # editor (tick the allowed, then pick one with a radio) for a flexibility
  # nothing consumed. Profiles written in the old shape are collapsed onto
  # their `default` on load — see `normalize_step_value` in src/data/mod.rs.
  #
  # A binding may be **absent**, which means no profile is chosen. That is a
  # real state — a freshly added step starts there — and it makes the step
  # unrunnable rather than defaulted: generating against a guessed machine or
  # fixture would produce a program for hardware the operator does not have.
  # The planner reports the missing binding instead.
  # -------------------------------------------------------------------------
  step:
    type: object
    default:
      name: Machining step
      operations: [drill_pth]
    properties:
      name:
        description: Human-readable step name (e.g. "Drill PTH + locating").
        type: string
        minLength: 1
        default: Machining step

      cnc:
        description: The CNC profile this step runs on. Absent means none is chosen.
        $ref: "id.yaml#/$defs/uuid_v7"
        x-ref: "cnc.yaml"

      fixture:
        description: The fixture profile holding the board. Absent means none is chosen.
        $ref: "id.yaml#/$defs/uuid_v7"
        x-ref: "fixture.yaml"

      toolset:
        description: The toolset (rack) this step loads. Absent means none is chosen.
        $ref: "id.yaml#/$defs/uuid_v7"
        x-ref: "toolset.yaml"

      # ---------------------------------------------------------------------
      # board_face — which face of the PCB this step cuts.
      #
      # `front` is the component side, `back` the solder side. Named for the
      # board and not for the machine, because "top" and "bottom" were doing
      # two jobs at once: which face of the PCB, and which way up it sits on
      # the bed. Those come apart the moment a step machines the back — the
      # board is turned over, so the PCB's *bottom* is what faces up. The bed's
      # own directions are `near`/`far` and `left`/`right` (fixture.yaml
      # `origin`), and no word is now shared between the two.
      #
      # Was `side_to_machine: top | bottom` (schema_version 3, pre-2026-07-31).
      # Both the key and the values are migrated on load — see
      # `normalize_step_value` in src/data/mod.rs. A CNC template reading
      # `steps[step_index].side_to_machine` must become `.board_face`, and its
      # values `"front"`/`"back"`.
      # ---------------------------------------------------------------------
      board_face:
        title: Board face to machine
        description: >-
          Which face of the PCB this step cuts: the front (component side) or
          the back (solder side). A back-face step machines the board turned
          over, so it needs locating pins drilled before it.
        type: string
        enum: [front, back]
        x-enum-labels: ["Front (component side)", "Back (solder side)"]
        default: front

      operations:
        description: Primitives run in this step, in order.
        type: array
        items: { $ref: "#/$defs/operation_key" }
        uniqueItems: true
        minItems: 1
        default: [drill_pth]

      # Registration pins. Two holes drilled through the board and on into the
      # backboard, on the fixture's flip mirror line, so the board can be turned
      # over and land back in the same place. The pins themselves are stock —
      # nothing here describes them beyond the diameter, because nothing else
      # about them is the program's business.
      drill_locating_pins:
        type: object
        default:
          pin_diameter: 3.2mm
        properties:
          # A fixed catalogue, not a free length, so `enum` rather than a
          # `units.yaml#/$defs/size` `$ref`. Two reasons, and the first is the
          # binding one: `classify` in crates/datastore/src/parse.rs tests `$ref`
          # *before* `enum`, so a size ref would render as a free-text unit box and
          # the enum would never be seen — the operator could type any diameter at
          # all. And a pin is bought, not machined: these are the sizes drill blanks
          # and dowel pins actually come in.
          #
          # The cost is that the value does not follow the program's unit mode the
          # way a `size` would. That is bearable here because the list is fixed and
          # already names the inch size the way an operator would ask for it.
          pin_diameter:
            title: Pin diameter
            description: >-
              Diameter of the registration pins, and so of the holes drilled for
              them. 3.2 mm is the default because it takes a 1/8" shank with about
              25 um of play; 3.175 mm IS 1/8", for a pin ground to size.
            type: string
            default: 3.2mm
            enum: ["2mm", "2.5mm", "3mm", "3.175mm", "3.2mm"]
        required: [pin_diameter]
        additionalProperties: false

      drill_pth:
        $ref: "#/$defs/drill_holes_common"
        default:
          holes:
            route_fallback: true
            drill_first: true
            pilot: false
            oblong: drill_ends_then_route

      drill_npth:
        $ref: "#/$defs/drill_holes_common"
        default:
          holes:
            route_fallback: true
            drill_first: true
            pilot: false
            oblong: drill_ends_then_route

      route_board:
        $ref: "#/$defs/route_board"
        default:
          outline:
            cut: route
            retention: { mode: tabs, count: 4, width: 2.0mm, mouse_bites: false }
          kerf: 2.0mm
          finishing: 0.1mm

      route_cutouts:
        $ref: "#/$defs/route_cutouts"
        default:
          retain_island: true
          island_tab: 4%
          drill_sharp_corners: true

      # `mill_board` was here, as a `$ref` to `route_board`'s own shape defaulting
      # `outline.cut` to `mill`. It is gone: it was a second key for one operation,
      # and being a second *key* was the harm — the once-per-face rule compares
      # keys, so a step could claim the boundary twice and the editor would not
      # stop it. Milling is a `cut` value on `route_board`, which is where the
      # choice always lived.
      #
      # Folded on load — see `fold_mill_board` in src/data/mod.rs, which moves the
      # block onto `route_board` and sets `outline.cut: mill` for a step that ran
      # it. A CNC template reading `steps[step_index].mill_board.*` must become
      # `.route_board.*`.

      engrave_copper:
        $ref: "#/$defs/engrave_copper"
        default:
          width: 0.25mm

    # The bindings are deliberately NOT required: absent means "no profile chosen",
    # which is where a freshly added step starts and a state the operator may leave it
    # in. Requiring them would reject a half-configured profile on load instead of
    # letting the planner report which binding is missing.
    required: [name, operations]
    additionalProperties: false

properties:
  schema_version:
    type: integer
    const: 3
    default: 3

  id:
    description: Unique machining profile ID.
    $ref: "id.yaml#/$defs/uuid_v7"

  name:
    type: string
    minLength: 1
    default: My machining profile

  steps:
    description: >
      Ordered machining steps (setups). Each step is one physical setup with
      its own CNC, fixture, toolset and operations. A profile has at least one
      step.
    type: array
    minItems: 1
    default:
      - name: Machining step
        operations: [drill_pth]
    items:
      $ref: "#/$defs/step"

required: [id, name, steps]

# Note: within a step, the per-operation config objects (drill_pth, route_board,
# …) are declared as optional properties with defaults and are always
# materialised by the loader, so they are NOT gated behind conditional-presence
# rules. Each step's `operations` array is the source of truth for which
# primitives are enabled in that step; a config object being present does not
# imply its operation is active.

additionalProperties: false
