$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "fixture.yaml"
x-schema-version: 1

title: Fixture Profile
description: >
  Fixture profile persisted configuration.
  This schema references shared UUID and unit definitions from files located
  in the same directory:
    - id.yaml
    - units.yaml

type: object

properties:

  # Version of this schema
  schema_version:
    type: integer
    const: 1
    description: Schema/data format version for this file.

  # ---------------------------------------------------------------------------
  # id
  # ---------------------------------------------------------------------------
  # Stable unique fixture profile identifier.
  #
  # Uses the shared UUIDv7 validator from id.yaml.
  #
  # Valid example:
  #   id: "01890fdb-4daf-7a37-8f6a-9dc397e5b4ef"
  #
  id:
    description: Unique fixture profile ID.
    $ref: "id.yaml#/$defs/uuid_v7"

  # ---------------------------------------------------------------------------
  # name
  # ---------------------------------------------------------------------------
  # Human-readable fixture profile name.
  #
  # Valid examples:
  #   name: "Default vacuum fixture"
  #   name: "Prototype clamp plate A"
  #
  name:
    type: string
    minLength: 1
    default: "My fixture profile"
    description: Fixture profile name.

  # ---------------------------------------------------------------------------
  # backboard_thickness
  # ---------------------------------------------------------------------------
  # Thickness of the back board, martyr board, or exit board.
  #
  # Uses the shared length validator from units.yaml.
  #
  # Valid examples:
  #   backboard_thickness: "2.5 mm"
  #   backboard_thickness: "2.5mm"
  #   backboard_thickness: "0.125 in"
  #   backboard_thickness: "1/8""
  #
  # WARNING:
  #   Keep this value accurate. If it is wrong, drilling operations may cut into
  #   the machining bed.
  #
  backboard_thickness:
    description: >
      Thickness of the back/martyr/exit-board. WARNING: Make sure this value is
      always accurate, otherwise there is a risk of drilling into the machining
      bed.
    default: "2.5mm"
    $ref: "units.yaml#/$defs/size"


  # ---------------------------------------------------------------------------
  # board_holding_method
  # ---------------------------------------------------------------------------
  # Method used to hold the board during machining.
  #
  # This is intentionally left as a free string for now, so the application can
  # evolve supported methods without changing the schema every time.
  #
  # Valid examples:
  #   board_holding_method: "vacuum"
  #   board_holding_method: "clamps"
  #   board_holding_method: "tape"
  #
  # A default is supplied so a freshly-created fixture is immediately usable
  # (`board_holding_method` is required; without a default the profile loads
  # incomplete and blocks generation — the same trap `name` had). The datastore
  # fills this on load, so existing files missing the key become usable too. The
  # user can change it to match their setup.
  board_holding_method:
    type: string
    minLength: 1
    default: clamps
    description: Supported board holding method.

  # The board work origin (which corner is X0/Y0) is defined by `origin`, below.
  # There is deliberately no "Z origin reference" field: Z0 is ALWAYS the top of
  # the PCB. What differs between machines is only *how* that zero is established,
  # which is a CNC-profile capability (`has_repeatable_home`), not a fixture toggle.

  # ---------------------------------------------------------------------------
  # work_coordinate_system
  # ---------------------------------------------------------------------------
  # WHICH of the machine's stored zero points this fixture is set up in.
  #
  # A fixture is clamped somewhere on the bed and its origin taught to the
  # controller once; a machine holds several such origins and the program selects
  # one. This says which — as an ORDINAL, not as a command. `1` is the machine's
  # first work coordinate system, `2` the second, and so on.
  #
  # It is deliberately NOT `G54`/`G55`. Only the CNC profile speaks a dialect, and
  # it maps the ordinal in its `initialise` template:
  #
  #   `G17 G{53 + work_coordinate_system} G40 G49 G80 G90
  #
  # Keeping it an ordinal is also what lets a controller run past the easy six —
  # Fanuc continues G59.1, G59.2 — which a fixed G54..G59 list never could:
  #
  #   `{if work_coordinate_system <= 6 { "G" + (53 + work_coordinate_system) }
  #      else { "G59." + (work_coordinate_system - 6) }}
  #
  # NOT the same thing as `origin` below. `origin` is which corner of the BOARD is
  # X0/Y0; this is which of the MACHINE's zeros the board is measured from.
  #
  # Only meaningful on a machine that homes repeatably (the CNC profile's
  # `has_repeatable_home`): without that the operator re-establishes the work zero
  # every job, so there is only ever the current one. The planner warns when the
  # step's CNC cannot honour the value.
  #
  # Valid examples:
  #   work_coordinate_system: 1
  #   work_coordinate_system: 3
  #
  work_coordinate_system:
    description: >-
      Which of the machine's stored work coordinate systems this fixture occupies,
      counting from 1. An ordinal, not a GCode word — the CNC profile's initialise
      template turns it into whatever its dialect uses.
    type: integer
    minimum: 1
    default: 1

  # ---------------------------------------------------------------------------
  # board_flip_axis
  # ---------------------------------------------------------------------------
  # How the board turns over for a bottom-side step. This is a property of the
  # FIXTURE, not of the job or the machining profile: it is decided entirely by
  # where the registration is — two pins on a left-to-right line let the board be
  # turned like a page (about Y), pins on a front-to-back line tumble it (about X).
  #
  # Getting it wrong produces a mirrored board, so there is no default that is
  # safe for every fixture; `y` is the common case (page turn) and is what the
  # schema assumes when a profile predates this field.
  #
  board_flip_axis:
    description: >-
      Which axis the board is turned about when a machining step works the
      bottom side. 'y' turns it left-to-right like a page (mirroring X, front
      edge stays at the front); 'x' tumbles it front-to-back (mirroring Y, left
      edge stays on the left). Ignored by top-side steps.
    type: string
    default: y
    enum: [x, y]

  # ---------------------------------------------------------------------------
  # locating_pins
  # ---------------------------------------------------------------------------
  # Locating pin strategy and geometry.
  #
  locating_pins:
    type: object
    description: Locating pin strategy and geometry.
    properties:

      # Locating pin strategy.
      #
      # Valid examples:
      #   strategy: "none"
      #   strategy: "two_pins"
      #   strategy: "three_pins"
      #
      strategy:
        type: string
        description: Locating pin strategy.

      # Locating pin diameter.
      #
      # Valid examples:
      #   pin_diameter: "3 mm"
      #   pin_diameter: "1/8""
      #
      pin_diameter:
        description: Diameter of locating pins.
        $ref: "units.yaml#/$defs/size"

      # Locating pin positions in the fixture coordinate system.
      #
      pin_positions:
        type: array
        description: Locating pin positions.
        items:
          type: object
          properties:

            # X coordinate of the locating pin.
            #
            # Valid examples:
            #   x: "10 mm"
            #   x: "0.5 in"
            #
            x:
              description: X coordinate of the locating pin.
              $ref: "units.yaml#/$defs/size"

            # Y coordinate of the locating pin.
            #
            # Valid examples:
            #   y: "20 mm"
            #   y: "1 in"
            #
            y:
              description: Y coordinate of the locating pin.
              $ref: "units.yaml#/$defs/size"

          required: [x, y]
          additionalProperties: false

    additionalProperties: true

  # ---------------------------------------------------------------------------
  # keep_out_zones
  # ---------------------------------------------------------------------------
  # Keep-out or clamp zones where machining motion must be avoided or where
  # additional Z clearance is required.
  #
  keep_out_zones:
    type: array
    description: Keep-out or clamp zones.
    items:
      type: object
      properties:

        # X coordinate of the keep-out zone origin.
        #
        # Valid examples:
        #   x: "0 mm"
        #   x: "1.25 in"
        #
        x:
          description: X coordinate of the keep-out zone origin.
          $ref: "units.yaml#/$defs/size"

        # Y coordinate of the keep-out zone origin.
        #
        # Valid examples:
        #   y: "0 mm"
        #   y: "2 in"
        #
        y:
          description: Y coordinate of the keep-out zone origin.
          $ref: "units.yaml#/$defs/size"

        # Width of the keep-out zone.
        #
        # Valid examples:
        #   width: "50 mm"
        #   width: "2 in"
        #
        width:
          description: Width of the keep-out zone.
          $ref: "units.yaml#/$defs/size"

        # Height of the keep-out zone.
        #
        # Valid examples:
        #   height: "25 mm"
        #   height: "1 in"
        #
        height:
          description: Height of the keep-out zone.
          $ref: "units.yaml#/$defs/size"

      # Retract/safe heights are fixture-global (`z_retract` / `z_safe` below), not
      # per keep-out zone — a zone only describes an XY region to avoid.
      required: [x, y, width, height]
      additionalProperties: false

  # ---------------------------------------------------------------------------
  # occupancy
  # ---------------------------------------------------------------------------
  # Describes the fixture occupancy impact on the usable board size range.
  #
  occupancy:
    type: object
    description: Fixture occupancy impact on board size range.
    properties:

      # Maximum usable board size along X.
      #
      # Valid examples:
      #   max_board_x: "300 mm"
      #   max_board_x: "12 in"
      #
      max_board_x:
        description: Maximum usable board size along X.
        $ref: "units.yaml#/$defs/size"

      # Maximum usable board size along Y.
      #
      # Valid examples:
      #   max_board_y: "200 mm"
      #   max_board_y: "8 in"
      #
      max_board_y:
        description: Maximum usable board size along Y.
        $ref: "units.yaml#/$defs/size"

      # Optional blocked regions.
      #
      # Kept generic for now because blocked-region modelling may evolve.
      #
      blocked_regions:
        type: array
        description: Generic blocked regions occupied by the fixture.
        items:
          type: object

    additionalProperties: true

  # ---------------------------------------------------------------------------
  # probing_alignment
  # ---------------------------------------------------------------------------
  # Optional probing/alignment parameters.
  #
  probing_alignment:
    type: object
    description: Optional probing/alignment parameters.
    properties:

      # Enables or disables probing alignment.
      #
      # Valid examples:
      #   enabled: true
      #   enabled: false
      #
      enabled:
        type: boolean
        default: false
        description: Enable probing alignment.

      # List of probing points in the fixture coordinate system.
      #
      probe_points:
        type: array
        description: Probing points used for alignment.
        items:
          type: object
          properties:

            # X coordinate of the probe point.
            #
            # Valid examples:
            #   x: "10 mm"
            #   x: "0.5 in"
            #
            x:
              description: X coordinate of the probe point.
              $ref: "units.yaml#/$defs/size"

            # Y coordinate of the probe point.
            #
            # Valid examples:
            #   y: "20 mm"
            #   y: "1 in"
            #
            y:
              description: Y coordinate of the probe point.
              $ref: "units.yaml#/$defs/size"

          required: [x, y]
          additionalProperties: false

    additionalProperties: true

  # ---------------------------------------------------------------------------
  # origin
  # ---------------------------------------------------------------------------
  # The board's work origin in XY: which corner is X0/Y0. The board is registered
  # to this corner in the fixture (e.g. pushed into a right-angle corner stop), and
  # the emitted G-code is written relative to it. Z0 is always the board top (see
  # the "Z model" section), so there is deliberately no Z entry here.
  #
  origin:
    description: Board work-origin corner — which side is X0 and which is Y0.
    type: object
    properties:

      # X axis zero orientation.
      #
      # Valid examples:
      #   x0: left
      #   x0: right
      #   x0: front
      #   x0: back
      #
      x0:
        description: X axis zero orientation.
        type: string
        enum: [left, right, front, back]
        default: left

      # Y axis zero orientation.
      #
      # Valid examples:
      #   y0: front
      #   y0: back
      #   y0: left
      #   y0: right
      #
      y0:
        description: Y axis zero orientation.
        type: string
        enum: [front, back, left, right]
        default: front

    required: [x0, y0]
    additionalProperties: false

  # ---------------------------------------------------------------------------
  # bed_clearance
  # ---------------------------------------------------------------------------
  bed_clearance:
    description: >
      Minimum clearance to the machining bed from the tip of any tool to prevent damage to the machine bed
    default: "0.5 mm"
    $ref: "units.yaml#/$defs/size"

  # ===========================================================================
  # Z model — how the emitted G-code depths are produced.
  # ===========================================================================
  # The work Z origin is ALWAYS the top of the PCB (Z0 = board top); the G-code
  # never carries a "what is zero" toggle. What varies by machine is only how the
  # operator/controller establishes that zero — a per-job surface touch-off on the
  # cheapest machines, or a computed/persisted reference on machines that home
  # repeatably — which is a CNC-profile capability (`has_repeatable_home`), not a
  # fixture setting. The fields below (plus `backboard_thickness` and
  # `bed_clearance` above) are the physical stack the depth math and bed-safety
  # checks need. Board thickness itself comes from the KiCad stackup, not here.

  # ---------------------------------------------------------------------------
  # breakthrough
  # ---------------------------------------------------------------------------
  # How far the tool travels past the underside of the board to guarantee a clean
  # through-hole or cut. It is bounded by `backboard_thickness` so the tool never
  # reaches the machine bed.
  #
  # Valid examples:
  #   breakthrough: "0.5 mm"
  #   breakthrough: "0.02 in"
  #
  breakthrough:
    description: >
      Distance the tool passes below the board's underside to fully clear a
      through-hole or cut. Kept small; bounded by the backboard thickness so the
      tool never reaches the machine bed.
    default: "0.5mm"
    $ref: "units.yaml#/$defs/size"

  # ---------------------------------------------------------------------------
  # z_retract
  # ---------------------------------------------------------------------------
  # The drilling R-plane: the height above the board surface the tool retracts to
  # between holes/features. Measured from the board top (Z0).
  #
  # Valid examples:
  #   z_retract: "5 mm"
  #   z_retract: "0.2 in"
  #
  z_retract:
    description: >
      Retract height above the board surface between features (the drilling R
      value). Measured from the board top (Z0).
    default: "5mm"
    $ref: "units.yaml#/$defs/size"

  # ---------------------------------------------------------------------------
  # z_safe
  # ---------------------------------------------------------------------------
  # The travel/clearance height for rapid moves across the work — high enough to
  # clear clamps, pins and any fixture hardware on the table. Measured from the
  # board top (Z0).
  #
  # Valid examples:
  #   z_safe: "20 mm"
  #   z_safe: "1 in"
  #
  z_safe:
    description: >
      Safe travel height for rapid moves across the work, clear of clamps and any
      fixture hardware. Measured from the board top (Z0).
    default: "20mm"
    $ref: "units.yaml#/$defs/size"

# Only the fields the app currently populates are mandatory. `locating_pins`,
# `keep_out_zones` and `occupancy` remain optional properties: they model
# fixture features not yet sourced by the app (Phase 3 — see the assigner plan)
# and the create/instantiate flow provides no defaults for them, so requiring
# them would make every fixture file load with spurious warnings.
# (`machining_plate_clearance` was a stale required key with no property
# definition — unsatisfiable by construction — and is superseded by
# `bed_clearance` above.)
required:
  - id
  - name
  - board_holding_method
  - origin

additionalProperties: false
