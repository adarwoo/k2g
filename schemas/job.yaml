$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "job.yaml"
x-schema-version: 1
type: object

# ---------------------------------------------------------------------------
# The Job is the single live thing being processed. It is not a named library
# item — there is exactly one, so it is a singleton (like settings/stock) with
# no id and no name. It references ONE machining profile (whose ordered steps
# describe the work) and, in future, will also carry the last-minute/live data
# for the current session.
#
#   Job → Machining profile → CNC / Fixture / Toolset
# ---------------------------------------------------------------------------

properties:
  schema_version:
    type: integer
    const: 1
    default: 1

  machining_profile:
    description: The machining profile this job runs (its ordered steps).
    $ref: "id.yaml#/$defs/uuid_v7"
    x-ref: "machining.yaml"

  board_orientation:
    description: >-
      Board placement angle in degrees for this run. Live per-job data — it lets
      the board be rotated to fit the CNC bed and is NOT a profile setting (the
      same board on a different bed may need a different angle).
    type: integer
    minimum: -180
    maximum: 180
    default: 0

  # ---------------------------------------------------------------------------
  # Retaining tabs
  #
  # The machining profile owns the *policy* — how many tabs, how wide, tab or
  # mouse bites (`route_board.edge`). It is reusable across boards, so it cannot
  # own *placement*: where a tab sits only means anything for one specific
  # outline. That is live per-job data, and it lives here beside the board
  # orientation for the same reason.
  # ---------------------------------------------------------------------------
  edge_tabs:
    description: >-
      Per-tab **nudges** away from where the application put them.

      Tab positions are computed, not stored: the profile says how many, and they
      are shared out over the outline's straight sides, longest first, evenly
      spaced within each side (see `distribute_tabs` in src/gcode/outline.rs). So
      what the job records is only the operator's disagreement with that — a
      signed distance along the contour from a tab's computed home.

      Storing the difference rather than the position is what makes a tab survive
      the board changing. Move the board in the KiCad layout, or lengthen a side,
      and the computed positions follow the new geometry while "the second tab on
      the long edge, nudged 3 mm along" still means the same thing. An absolute
      position would silently end up somewhere else.

      Only non-zero nudges are stored, so an empty list means "as computed" — the
      normal case.
    type: array
    default: []
    items:
      type: object
      properties:
        contour:
          description: >-
            Which outline this tab holds: the board's own boundary, or the edge
            of an interior cutout (which needs tabs too when the slug is big
            enough to move).
          type: string
          default: outer
          enum: [outer, cutout]
        index:
          description: >-
            Which contour of that kind, in the stitcher's order. Always 0 for a
            board with a single outline and no cutouts.
          type: integer
          minimum: 0
          default: 0
        tab:
          description: >-
            Which computed tab on that contour, counting from 0 in contour order.
          type: integer
          minimum: 0
        offset:
          description: >-
            How far along the contour to move it from its computed home. Signed:
            positive runs the way the contour is traversed. The clearance rule
            still applies, so a nudge that would push a tab into a corner or into
            its neighbour is clamped rather than obeyed.
          $ref: "units.yaml#/$defs/offset"
      required: [tab, offset]
      additionalProperties: false

  edge_tabs_locked:
    description: >-
      Move every tab together. With this set, nudging one tab applies the same
      offset to all of them — the usual intent when the whole pattern wants
      shifting round, rather than one tab clearing one obstruction. A UI
      behaviour: it changes how offsets are written, never how they are read.
    type: boolean
    default: false

required: [schema_version]

additionalProperties: false
