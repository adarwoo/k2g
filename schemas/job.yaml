$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "job.yaml"
x-schema-version: 1
type: object

# ---------------------------------------------------------------------------
# The Job is the single live thing being processed. It is not a named library
# item — there is exactly one, so it is a singleton (like settings/stock) with
# no id and no name. It references ONE machining profile (whose ordered steps
# describe the work) and, in future, will also carry the last-minute/live data
# for the current session.
#
#   Job → Machining profile → CNC / Fixture / Toolset
# ---------------------------------------------------------------------------

properties:
  schema_version:
    type: integer
    const: 1
    default: 1

  machining_profile:
    description: The machining profile this job runs (its ordered steps).
    $ref: "id.yaml#/$defs/uuid_v7"
    x-ref: "machining.yaml"

  board_orientation:
    description: >-
      Board placement angle in degrees for this run. Live per-job data — it lets
      the board be rotated to fit the CNC bed and is NOT a profile setting (the
      same board on a different bed may need a different angle).
    type: integer
    minimum: -180
    maximum: 180
    default: 0

  # ---------------------------------------------------------------------------
  # Retaining tabs
  #
  # The machining profile owns the *policy* — how many tabs, how wide, tab or
  # mouse bites (`route_board.edge`). It is reusable across boards, so it cannot
  # own *placement*: where a tab sits only means anything for one specific
  # outline. That is live per-job data, and it lives here beside the board
  # orientation for the same reason.
  # ---------------------------------------------------------------------------
  edge_tabs:
    description: >-
      Where the retaining tabs sit on the board outline, for this board.

      A tab is stored as a position **along a contour**, not as an XY point:
      `at` is the fraction of the contour's total length, measured from the
      contour's first segment start in the stitcher's traversal order. That way
      moving the board in the KiCad layout — which happens constantly — leaves
      every tab where the operator put it, whereas an absolute coordinate would
      be invalidated by any translation.

      Each tab is centred on its position and spans the profile's `tab_width`
      along the contour, whatever retention mode the profile asks for (a solid
      tab, a row of mouse-bite drills, or both).

      An empty list means place them automatically: the profile's tab count,
      spread evenly by arc length around each contour that is cut. Any entry at
      all takes over completely, so what is generated is what is shown.
    type: array
    default: []
    items:
      type: object
      properties:
        contour:
          description: >-
            Which outline this tab holds: the board's own boundary, or the edge
            of an interior cutout (which needs tabs too when the slug is big
            enough to move).
          type: string
          default: outer
          enum: [outer, cutout]
        index:
          description: >-
            Which contour of that kind, in the stitcher's order. Always 0 for a
            board with a single outline and no cutouts.
          type: integer
          minimum: 0
          default: 0
        at:
          description: >-
            Position along the contour as a fraction of its length, from its
            start point. 0 and 1 are the same place.
          type: number
          minimum: 0
          exclusiveMaximum: 1
      required: [at]
      additionalProperties: false

required: [schema_version]

additionalProperties: false
