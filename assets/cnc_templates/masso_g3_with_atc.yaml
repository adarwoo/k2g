# =============================================================================
# CNC profile: MASSO G3 (ATC), firmware 5.13
# Conforms to cnc.yaml, schema_version 1.
#
# Dialect notes baked into this profile:
#   - No G49 and no G43: MASSO applies tool length from its tool table at M06.
#   - No G10 anywhere: a generated program must never WRITE offsets.
#   - T before M06: MASSO requires "T{n} M06"; the reverse is unpredictable.
#   - Extended work offsets G54.1 P1..P100 accepted (firmware 5.13+). Cloning
#     this profile for 5.12 or earlier: delete the marked loop in set_origin.
#   - Drilling uses the modal G81 form: cycle opened on the first hole of a
#     block, bare coordinates after, G80 on the last.
# =============================================================================

name: "Masso G3 - With ATC"

machine:
  # 60k spindle; min is typical for this class - set it from the VFD's floor.
  spindle_rpm_min: "10000rpm"
  spindle_rpm_max: "60000rpm"
  # Conservative starting values: the machine's real limits are on its
  # specification, and a tool rated faster is run at a lower spindle speed so
  # its chip load is still met.
  max_feed_xy: "5000mm/min"
  max_feed_z: "5000mm/min"

  output_file_extension: "nc"

  # 9-slot rack. (Set 8 when running with the dust hood fitted, or model the
  # blocked slot in the toolset instead - whichever way k2g ends up encoding it.)
  atc_slot_count: 9

  scaling:
    x: 1.0
    y: 1.0

  # MASSO homes to a repeatable machine origin; stored work offsets survive
  # power cycles (backup battery permitting).
  has_repeatable_home: true

  # Tool setter measures every tool automatically at M06, so tool_measure is
  # skipped entirely for this machine.
  tool_length_measurement: auto_setter

primitives:

  # ===========================================================================
  # Program
  # ===========================================================================

  # Header.
  #
  # Order matters here and each line earns its place:
  #
  #   1. Modal state FIRST, and it moves nothing. A program inherits whatever the
  #      last one left - G91 incremental, G95 feed-per-revolution, a live G81. Every
  #      line below depends on those being known, so nothing may move until they are.
  #      G94 in particular: left in G95 the F words become feed-per-*revolution* and
  #      every plunge runs ~20000x slow or fast depending which way you read it.
  #   2. Units, before any coordinate is emitted.
  #   3. Only then the retract - and in MACHINE coordinates, because at this point the
  #      controller still carries the previous job's tool and offset, so a work-frame
  #      Z would resolve against state this program did not set.
  #   4. The work offset last. Nothing before it needed one.
  #
  # G53 carries an explicit G0. G53 is non-modal and supplies no motion of its own:
  # after a program that left G1 modal, a bare `G53 Z0` is a FEED move at whatever F
  # was last commanded - or an error if none was.
  #
  # No G49 here: this machine measures at M06 (tool_length_measurement: auto_setter),
  # so cancelling tool-length compensation would be fighting the control rather than
  # clearing inherited state.
  #
  # There is deliberately no closing `G0 Z{z_safe}`. G53 Z0 has already parked the
  # tool at the top of machine travel, which is clear of everything; descending to a
  # work-frame height from there buys nothing and gets closer to the fixture. Every
  # tool block retracts again on entry, and every cycle makes its own approach.
  program_begin: |
    let board = filename;
    board.replace(".kicad_pcb", "");
    `(Created by K2G from '{board}'`
    if steps.len() > 1 {
       if steps[step_index].name != "" {
           ` - step {step_index + 1} of {steps.len()}: {steps[step_index].name}`
       } else {
           ` - step {step_index + 1} of {steps.len()}`
       }
    }
    ` - {timestamp})
    `(Target: MASSO G3 firmware 5.13)
    `G90 G94 G17 G40 G80
    metric();
    `G53 G0 Z0
    set_origin();

  # Footer. M05 is belt-and-braces - the body has already stopped the spindle,
  # but the footer must be safe even if a future path reaches it early.
  # Park via G53 so it does not depend on the work offset still being valid,
  # and clear of the board so the operator can reach the work.
  # M30 last: nothing after it executes.
  # Footer. M05 is belt-and-braces - the body has already stopped the spindle, but
  # the footer must be safe even if a future path reaches it early. G80 likewise: a
  # program must not end leaving a canned cycle live for whatever runs next.
  #
  # Z retracts before X/Y, as its own block. Parking with a single `G53 G0 X0 Y0 Z0`
  # would be a diagonal move that drags the tool across the work while it lifts.
  #
  # G53 so parking does not depend on the work offset still being valid, and M30
  # last because nothing after it executes.
  program_end: |
    `(end of program)
    `M05
    `G80
    `G53 G0 Z0
    `G53 G0 X0 Y0
    `M30

  # G21/G20 as standard.
  set_unit: '`{if metric { "G21" } else { "G20" }}'

  # G54..G59 plus MASSO's extended offsets G54.1 P1..P100 (firmware 5.13+).
  set_origin: |
    let key = origin_reference;
    key.trim();
    key.make_upper();
    key.replace(" ", "");
    if key.is_empty() {
        throw "the fixture has no origin reference. Leaving it blank would run " +
              "the job against whatever origin the controller happens to have " +
              "active. Set it to G54-G59, or G54.1 P1 to G54.1 P100.";
    }
    let valid = [];
    for n in 54..=59 { valid.push("G" + n); }
    // --- Extended offsets: MASSO firmware 5.13 or later only. ---------------
    // Cloning this profile for 5.12 or earlier: DELETE the next line.
    for p in 1..=100 { valid.push("G54.1P" + p); }
    // ------------------------------------------------------------------------
    if !valid.contains(key) {
        throw "'" + origin_reference + "' is not a valid origin reference for " +
              "this machine. MASSO G3 accepts G54 to G59, and G54.1 P1 to " +
              "G54.1 P100 on firmware 5.13 or later. Check the value in the " +
              "fixture profile against the offset shown on the MASSO F1 screen.";
    }
    if key.starts_with("G54.1P") {
        `G54.1 P{key.sub_string(6)}
    } else {
        `{key}
    }

  # ===========================================================================
  # Tools and spindle
  # ===========================================================================

  # ATC change. Spindle stopped first; T before M06 (MASSO requires this
  # order). The tool setter fires at M06, so nothing else is needed here.
  # manual_message is empty on this machine; the guard keeps the template
  # correct if the profile is ever cloned for a manual-change MASSO.
  # Tool change.
  #
  # POSTCONDITION - the two lines after M06 are not optional:
  #
  #   G80  No canned cycle is active. G81 is modal and survives a tool change, so
  #        any motion the controller's own M06 macro makes would be interpreted as
  #        another hole - at the previous hole's depth and feed.
  #
  #   G53 G0 Z0  The tool is at machine clearance.
  #
  # The retract is THE reason this machine crashed. With an automatic tool setter,
  # M06 ends wherever the controller's macro leaves the spindle, which is directly
  # over the setter after it has measured. The next thing the program does is a
  # drill cycle whose R-plane rapid descends - into the setter. The generator cannot
  # know where M06 parked the spindle, so the program must not inherit that position.
  #
  # X/Y is deliberately left undefined on exit: callers position explicitly, and a
  # tool change should not decide where the work is.
  #
  # Cloning this for a machine whose clearance is not the top of Z travel - a dust
  # shoe, a camera, a rack in the way - use `G53 G0 Z-5` or whatever is genuinely
  # clear. It is a machine fact, so it belongs here in the profile rather than in a
  # schema field the application would have to turn into a G-word.
  tool_change: |
    `M05
    `G80
    if manual_message != "" {
        pause(manual_message);
    }
    `T{slot} M06
    `G53 G0 Z0

  # Auto setter at M06 - nothing to emit, and the engine skips this primitive
  # anyway because tool_length_measurement is auto_setter.
  tool_measure: ""

  # S before M03, then a spin-up dwell so the first plunge never happens on a
  # spindle still ramping. 2 s suits a 60k air-cooled spindle; set it from the
  # VFD's measured ramp time.
  #
  # The dwell is a literal rather than a machine-block field for the same reason as
  # the clearance above: it is this spindle's ramp time, and the profile is where
  # this machine's facts live.
  spindle_start: |
    `S{rpm}
    `M03
    `G4 P2.0

  spindle_stop: "`M05"

  # ===========================================================================
  # Motion
  # ===========================================================================

  move_rapid: "`G0 X{x} Y{y} Z{z}"

  # Always carries its own F - after a drill block the modal feed is the
  # plunge feed, which a routing move must never inherit.
  cut_linear: "`G1 X{x} Y{y} Z{z} F{feedrate}"

  # IJK centre-offset form (the R form cannot express a full circle, and round
  # pads/slot ends are full circles).
  cut_arc: '`{if clockwise { "G2" } else { "G3" }} X{x} Y{y} I{i} J{j} F{xy_feedrate}'


  # ===========================================================================
  # Drilling
  # ===========================================================================

  # Modal canned cycle: G81 with full words on the first hole of the block,
  # bare coordinates for the rest, G80 after the last. A one-hole block opens
  # and cancels immediately, which is correct rather than a special case.
  #
  # NOTE - restart trade-off: bare-coordinate lines make "start from line N"
  # unsafe mid-block (no Z/R/F on the line the controller resumes at). For a
  # restartable program, replace the body with the single fully-worded line:
  #   `G81 X{x} Y{y} Z{z_bottom} R{z_retract} F{z_feedrate}
  # and keep the trailing G80.
  # G99 is explicit and matters: it returns the tool to the R plane between holes
  # rather than to the initial level it entered the cycle at. Inherited G98 would
  # climb back to whatever Z the block started from after EVERY hole - on a board
  # with a few hundred holes that is minutes of vertical travel for nothing.
  #
  # It also has to be stated rather than assumed, because the cycle is opened right
  # after a tool change that parked the tool at machine top: under G98 the initial
  # level IS machine top, and the cycle would return there after every hole.
  drill: |
    if index == 0 {
        `G99 G81 X{x} Y{y} Z{z_bottom} R{z_retract} F{z_feedrate}
    } else {
        `X{x} Y{y}
    }
    if index == count - 1 {
        `G80
    }

  # ===========================================================================
  # Operator
  # ===========================================================================

  comment: "`( {text} )"

  # On-screen message, non-blocking.
  message: "`(MSG, {text})"

  # Message then a hard stop; cycle start resumes. M00 rather than M01 so the
  # stop does not depend on the optional-stop switch being enabled.
  pause: |
    `(MSG, {text})
    `M00

  # ===========================================================================
  # Output formatting
  # ===========================================================================

  # N-numbering in steps of 10, comments left bare so they read cleanly and
  # renumbering never touches them. Clear this template to diff two generated
  # programs without every line changing.
  line_format: |
    if text.starts_with("(") {
        `{text}
    } else {
        `N{(index + 1) * 10} {text}
    }
