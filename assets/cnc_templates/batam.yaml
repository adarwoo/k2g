# Bantam Tools Desktop PCB Milling Machine
# The Bantam Tools machines are popular and specifically designed for PCB prototyping.
# They use a TinyG motion controller and have some specific G-code requirements and limitations.
#
# Important notes for Bantam Tools:
#  - The TinyG controller does not support canned cycles like G81. The drill
#    primitive still emits G81 and must be expanded by the application when used.
#  - G54 is reserved for the machine's own reference, so the first usable work
#    coordinate system is G55. `set_origin` below therefore refuses G54 outright —
#    a thing this machine could not express while the fixture held an ordinal and
#    each profile mapped it arithmetically.
#
# Primitives use the GCode Template Language (see docs/gcode-template-language.md):
# a backtick line emits GCode, other lines are Rhai script, and {expr} in an emit
# line is evaluated and unit-converted. metric() emits G21 and fixes the unit.

name: "Bantam Tools Desktop PCB Milling Machine"

machine:
  spindle_rpm_min: "10000rpm"
  spindle_rpm_max: "28000rpm"
  # Conservative starting values: the machine's real limits are on its
  # specification, and a tool rated faster is run at a lower spindle speed so
  # its chip load is still met.
  max_feed_xy: "5000mm/min"
  max_feed_z: "5000mm/min"
  output_file_extension: "nc"
  atc_slot_count: 0
  scaling:
    x: 1.0
    y: 1.0

primitives:
  # How this machine is told which unit system to use. Emitted by the metric() and
  # imperial() calls below; the application holds no G-code word of its own.
  set_unit: '`{if metric { "G21" } else { "G20" }}'
  # Which stored zero the fixture sits in. G54 is the machine's own reference on a
  # Bantam, so the usable offsets start at G55 — see the note at the top of this file.
  set_origin: |
    let key = origin_reference;
    key.trim();
    key.make_upper();
    key.replace(" ", "");
    if key.is_empty() {
        throw "the fixture has no origin reference. Leaving it blank would run the " +
              "job against whatever origin the controller happens to have active. " +
              "Set it to one of: G55 G56 G57 G58 G59.";
    }
    let valid = [];
    for n in 55..=59 { valid.push("G" + n); }
    if !valid.contains(key) {
        throw "'" + origin_reference + "' is not a valid origin reference for this " +
              "machine. The Bantam reserves G54 for its own reference, so the usable " +
              "work coordinate systems are G55 G56 G57 G58 G59. Extended offsets " +
              "(G54.1 P...) are not available on TinyG.";
    }
    `{key}
  program_begin: |
    `(Created by kicad2gcode from '{filename}' - {timestamp})
    `G17 G90 G40 G49 G80 G94
    metric();
    set_origin();
    `G0 Z{z_safe}
  move_rapid: "`G0 X{x} Y{y} Z{z}"
  cut_linear: "`G1 X{x} Y{y} Z{z} F{feedrate}"
  spindle_start: |
    `S{rpm}
    `M3
  spindle_stop: "`M5"
  drill: "`G81 X{x} Y{y} Z{z_bottom} R{z_retract} F{z_feedrate}"
  cut_arc: '`{if clockwise { "G2" } else { "G3" }} X{x} Y{y} I{i} J{j} F{xy_feedrate}'
  tool_change: |
    `M5
    `{manual_message}
    `T{slot} M6
  program_end: |
    `(end of file)
    `G0 X0 Y0 Z{z_safe}
  pause: |
    `MSG {text}
    `M1
  comment: "`( {text} )"
  # `line_format` owns the WHOLE line — `{text}` must be emitted or the G-code is lost.
  # `index` counts non-blank lines from 0, so the first line is N10.
  line_format: "`N{(index + 1) * 10} {text}"
