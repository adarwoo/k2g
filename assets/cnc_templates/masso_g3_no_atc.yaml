# Masso G3 - Manual Tool Change
# Suitable for a standard Masso G3 build without an automatic tool changer.
# Operator is prompted to load each tool manually.
#
# Primitives use the GCode Template Language (see docs/gcode-template-language.md):
# a backtick line emits GCode, other lines are Rhai script, and {expr} in an emit
# line is evaluated and unit-converted. metric() emits G21 and fixes the unit.

name: "Masso G3 - Manual Tool Change"

machine:
  spindle_rpm_min: "5000rpm"
  spindle_rpm_max: "24000rpm"
  # Conservative starting values: the machine's real limits are on its
  # specification, and a tool rated faster is run at a lower spindle speed so
  # its chip load is still met.
  max_feed_xy: "5000mm/min"
  max_feed_z: "5000mm/min"
  output_file_extension: "nc"
  atc_slot_count: 0
  scaling:
    x: 1.0
    y: 1.0
  has_repeatable_home: true
  tool_length_measurement: auto_setter

primitives:
  # How this machine is told which unit system to use. Emitted by the metric() and
  # imperial() calls below; the application holds no G-code word of its own.
  set_unit: '`{if metric { "G21" } else { "G20" }}'
  # Which stored zero the fixture sits in. The MASSO has the usual six plus the
  # extended G54.1 P1..P100 bank, which is where most of its offsets live.
  set_origin: |
    let key = origin_reference;
    key.trim();
    key.make_upper();
    key.replace(" ", "");          // "G54.1 P7" -> "G54.1P7"
    if key.is_empty() {
        throw "the fixture has no origin reference. Leaving it blank would run the " +
              "job against whatever origin the controller happens to have active. " +
              "Set it to G54-G59, or G54.1 P1 to G54.1 P100.";
    }
    let valid = [];
    for n in 54..=59 { valid.push("G" + n); }
    // --- extended offsets: MASSO 5.13+ only. -------------------
    // Delete this loop when cloning for 5.12 or earlier.
    for p in 1..=100 { valid.push("G54.1P" + p); }
    // -----------------------------------------------------------
    if !valid.contains(key) {
        throw "'" + origin_reference + "' is not a valid origin reference for this " +
              "machine. MASSO G3 accepts G54 to G59, and G54.1 P1 to G54.1 P100 on " +
              "firmware 5.13 or later. Check the value in the fixture profile " +
              "against the work offset shown on the MASSO F1 screen.";
    }
    // Re-space the extended form for readability in the output.
    if key.starts_with("G54.1P") {
        `G54.1 P`
        `{key.sub_string(6)}
    } else {
        `{key}
    }
  program_begin: |
    `(Created by kicad2gcode from '{filename}' - {timestamp})
    `G17 G40 G49 G80 G90
    set_origin();
    metric();
    `G0 Z{z_safe}
  move_rapid: "`G0 X{x} Y{y} Z{z}"
  cut_linear: "`G1 X{x} Y{y} Z{z} F{feedrate}"
  spindle_start: |
    `S{rpm}
    `M3
  spindle_stop: "`M5"
  drill: "`G81 X{x} Y{y} Z{z_bottom} R{z_retract} F{z_feedrate}"
  cut_arc: '`{if clockwise { "G2" } else { "G3" }} X{x} Y{y} I{i} J{j} F{xy_feedrate}'
  tool_change: |
    `M5
    `{manual_message}
    `T{slot} M6
  program_end: |
    `(end of file)
    `G0 Z{z_safe}
    `G0 X0 Y0
  pause: |
    `MSG {text}
    `M1
  comment: "`( {text} )"
  # `line_format` owns the WHOLE line: it is handed `index` (from 0) and `text`, and
  # emits the line that replaces it. Emitting nothing would drop the line entirely.
  #
  # Comments are passed through unnumbered: an `N` word in front of a `(...)` or `;`
  # line buys nothing — nothing seeks to it, and it only widens the program the operator
  # reads on the console.
  line_format: |
    if text.starts_with("(") || text.starts_with(";") {
        `{text}
    } else {
        `N{(index + 1) * 10} {text}
    }
