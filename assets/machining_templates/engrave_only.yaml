# Engrave the copper isolation and stop.
#
# The one-operation profile, for the board whose holes and outline are not this machine's
# problem: a blank that will be sheared to size and hand-drilled, an isolation pass being
# re-cut because the first came out too shallow, or the copper half of a job whose drilling
# happens on a press.
#
# It is also the profile to prove a V-bit with. `engrave_copper.test_cut` is left at the
# schema default (off); turning it on cuts a short L in the waste at the exact depth the
# pass will use and stops, so the channel width can be measured with a loupe before any
# copper is touched — see `gcode::testcut`. That check is worth more here than anywhere
# else, because isolation is the one operation whose quality is a depth tolerance: the pass
# runs at one fixed Z for its whole length, and the channel is as wide as that Z makes it.
#
# ## What it needs
#
# A V-bit in stock, and nothing else. Isolation has no fallback — without an engraving tool
# the planner refuses rather than emitting a program that cannot be cut.
#
# Like every bundled machining template this names no `cnc`, `fixture` or `toolset` on its
# step: those are bound at creation to whichever the user has exactly one of (see
# `AppData::create_from_template`).

$schema: machining.yaml
schema_version: 3

name: "Single sided — engrave only"

steps:
  - name: "Engrave"
    board_face: front
    operations:
      - engrave_copper
