$schema: catalog.yaml
schema_version: 1

name: Generic
description: >
  Generic metric PCB tooling with conservative machining parameters.
  Suitable as a starting point when manufacturer datasheets are unavailable.
  All values should be calibrated to your substrate, machine, and tool brand
  before production use.

sections:
  - name: Drillbits
    default_flute_length_unit: mm
    description: Metric sizes — conservative parameters for unbranded carbide PCB drills
    tools:
      - { type: drillbit, diameter: '0.30mm',  spindle_rpm:  '60000rpm', z_feed:  '1500mm/min', sku_name: 'generic-Drillbits-D0.30', point_angle: '130deg', max_hits: 2000 }
      - { type: drillbit, diameter: '0.40mm',  spindle_rpm:  '50000rpm', z_feed:  '1500mm/min', sku_name: 'generic-Drillbits-D0.40', point_angle: '130deg', max_hits: 2000 }
      - { type: drillbit, diameter: '0.50mm',  spindle_rpm:  '40000rpm', z_feed:  '1600mm/min', sku_name: 'generic-Drillbits-D0.50', point_angle: '130deg', max_hits: 2000 }
      - { type: drillbit, diameter: '0.60mm',  spindle_rpm:  '35000rpm', z_feed:  '1750mm/min', sku_name: 'generic-Drillbits-D0.60', point_angle: '130deg', max_hits: 2000 }
      - { type: drillbit, diameter: '0.70mm',  spindle_rpm:  '30000rpm', z_feed:  '1800mm/min', sku_name: 'generic-Drillbits-D0.70', point_angle: '130deg', max_hits: 2000 }
      - { type: drillbit, diameter: '0.80mm',  spindle_rpm:  '25000rpm', z_feed:  '1750mm/min', sku_name: 'generic-Drillbits-D0.80', point_angle: '130deg', max_hits: 2000 }
      - { type: drillbit, diameter: '0.90mm',  spindle_rpm:  '22000rpm', z_feed:  '1760mm/min', sku_name: 'generic-Drillbits-D0.90', point_angle: '130deg', max_hits: 2000 }
      - { type: drillbit, diameter: '1.00mm',  spindle_rpm:  '20000rpm', z_feed:  '1800mm/min', sku_name: 'generic-Drillbits-D1.00', point_angle: '130deg', max_hits: 2000 }
      - { type: drillbit, diameter: '1.20mm',  spindle_rpm:  '17000rpm', z_feed:  '1870mm/min', sku_name: 'generic-Drillbits-D1.20', point_angle: '132deg', max_hits: 2000 }
      - { type: drillbit, diameter: '1.50mm',  spindle_rpm:  '13000rpm', z_feed:  '1820mm/min', sku_name: 'generic-Drillbits-D1.50', point_angle: '135deg', max_hits: 2000 }
      - { type: drillbit, diameter: '1.60mm',  spindle_rpm:  '12500rpm', z_feed:  '1875mm/min', sku_name: 'generic-Drillbits-D1.60', point_angle: '135deg', max_hits: 2000 }
      - { type: drillbit, diameter: '2.00mm',  spindle_rpm:  '10000rpm', z_feed:  '1800mm/min', sku_name: 'generic-Drillbits-D2.00', point_angle: '140deg', max_hits: 1800 }
      - { type: drillbit, diameter: '2.50mm',  spindle_rpm:   '8000rpm', z_feed:  '1800mm/min', sku_name: 'generic-Drillbits-D2.50', point_angle: '140deg', max_hits: 1800 }
      - { type: drillbit, diameter: '3.00mm',  spindle_rpm:   '6700rpm', z_feed:  '1675mm/min', sku_name: 'generic-Drillbits-D3.00', point_angle: '145deg', max_hits: 1800 }
      - { type: drillbit, diameter: '3.175mm', spindle_rpm:   '6300rpm', z_feed:  '1575mm/min', sku_name: 'generic-Drillbits-D3.175', point_angle: '145deg', max_hits: 1800 }
      - { type: drillbit, diameter: '4.00mm',  spindle_rpm:   '5000rpm', z_feed:  '1500mm/min', sku_name: 'generic-Drillbits-D4.00', point_angle: '150deg', max_hits: 1800 }
      - { type: drillbit, diameter: '5.00mm',  spindle_rpm:   '4000rpm', z_feed:  '1400mm/min', sku_name: 'generic-Drillbits-D5.00', point_angle: '150deg', max_hits: 1800 }
      - { type: drillbit, diameter: '6.00mm',  spindle_rpm:   '3300rpm', z_feed:  '1320mm/min', sku_name: 'generic-Drillbits-D6.00', point_angle: '150deg', max_hits: 1800 }

  - name: Router bits
    default_flute_length_unit: mm
    description: Metric sizes — conservative parameters for PCB outline routing in FR4
    tools:
      - { type: routerbit, diameter: '0.80mm',  spindle_rpm: '32000rpm', table_feed:  '400mm/min', z_feed: '150mm/min', sku_name: 'generic-Routerbits-R0.80', point_angle: '180deg' }
      - { type: routerbit, diameter: '1.00mm',  spindle_rpm: '32000rpm', table_feed:  '600mm/min', z_feed: '200mm/min', sku_name: 'generic-Routerbits-R1.00', point_angle: '180deg' }
      - { type: routerbit, diameter: '1.20mm',  spindle_rpm: '28000rpm', table_feed:  '720mm/min', z_feed: '200mm/min', sku_name: 'generic-Routerbits-R1.20', point_angle: '180deg' }
      - { type: routerbit, diameter: '1.50mm',  spindle_rpm: '22000rpm', table_feed:  '770mm/min', z_feed: '250mm/min', sku_name: 'generic-Routerbits-R1.50', point_angle: '180deg' }
      - { type: routerbit, diameter: '2.00mm',  spindle_rpm: '16000rpm', table_feed:  '800mm/min', z_feed: '300mm/min', sku_name: 'generic-Routerbits-R2.00', point_angle: '180deg' }
      - { type: routerbit, diameter: '2.40mm',  spindle_rpm: '14000rpm', table_feed:  '840mm/min', z_feed: '300mm/min', sku_name: 'generic-Routerbits-R2.40', point_angle: '180deg' }
      - { type: routerbit, diameter: '3.00mm',  spindle_rpm: '11000rpm', table_feed:  '880mm/min', z_feed: '200mm/min', sku_name: 'generic-Routerbits-R3.00', point_angle: '180deg' }
      - { type: routerbit, diameter: '3.175mm', spindle_rpm: '10000rpm', table_feed:  '800mm/min', z_feed: '200mm/min', sku_name: 'generic-Routerbits-R3.175', point_angle: '180deg' }

  # V-bits are listed by the two numbers that decide what they cut: the flat at the
  # very tip, and the included angle of the cone above it. `diameter` is the shank —
  # 3.175mm (1/8") throughout — and is not a cutting width at all, because a V-bit has
  # no single width. It cuts `tip + 2·depth·tan(angle/2)`, so the width is chosen by
  # how deep it is sunk.
  #
  # That is what makes them the tool for isolation engraving: one bit cuts a 0.1mm
  # channel or a 0.4mm one. It is also why they are unforgiving — the depth is the
  # width, so how flat the board is *is* the tolerance on the trace. A shallower cone
  # opens out more slowly and is therefore the more controllable choice at a given
  # width; the steep ones are here for wider channels and for chamfering.
  #
  # `z_min_depth` is zero on purpose. A drill has a real floor (the depth its point is
  # buried at) but a V-bit cuts from the tip down and has none — the constraint that
  # matters is the tip diameter, which is a channel it cannot cut narrower than.
  - name: V-bits
    default_flute_length_unit: mm
    description: Conical engraving bits for isolation routing — 1/8" shank, tip and angle as listed
    tools:
      - { type: vbit, diameter: '3.175mm', tip_diameter: '0.10mm', point_angle: '10deg', spindle_rpm: '24000rpm', table_feed: '200mm/min', z_feed:  '60mm/min', z_min_depth: '0mm', sku_name: 'generic-Vbits-V10-T0.10' }
      - { type: vbit, diameter: '3.175mm', tip_diameter: '0.10mm', point_angle: '15deg', spindle_rpm: '24000rpm', table_feed: '250mm/min', z_feed:  '70mm/min', z_min_depth: '0mm', sku_name: 'generic-Vbits-V15-T0.10' }
      - { type: vbit, diameter: '3.175mm', tip_diameter: '0.10mm', point_angle: '20deg', spindle_rpm: '24000rpm', table_feed: '300mm/min', z_feed:  '80mm/min', z_min_depth: '0mm', sku_name: 'generic-Vbits-V20-T0.10' }
      - { type: vbit, diameter: '3.175mm', tip_diameter: '0.10mm', point_angle: '30deg', spindle_rpm: '20000rpm', table_feed: '350mm/min', z_feed:  '90mm/min', z_min_depth: '0mm', sku_name: 'generic-Vbits-V30-T0.10' }
      - { type: vbit, diameter: '3.175mm', tip_diameter: '0.20mm', point_angle: '30deg', spindle_rpm: '20000rpm', table_feed: '400mm/min', z_feed: '100mm/min', z_min_depth: '0mm', sku_name: 'generic-Vbits-V30-T0.20' }
      - { type: vbit, diameter: '3.175mm', tip_diameter: '0.20mm', point_angle: '45deg', spindle_rpm: '18000rpm', table_feed: '450mm/min', z_feed: '110mm/min', z_min_depth: '0mm', sku_name: 'generic-Vbits-V45-T0.20' }
      - { type: vbit, diameter: '3.175mm', tip_diameter: '0.20mm', point_angle: '60deg', spindle_rpm: '16000rpm', table_feed: '500mm/min', z_feed: '120mm/min', z_min_depth: '0mm', sku_name: 'generic-Vbits-V60-T0.20' }
      - { type: vbit, diameter: '3.175mm', tip_diameter: '0.30mm', point_angle: '90deg', spindle_rpm: '14000rpm', table_feed: '500mm/min', z_feed: '150mm/min', z_min_depth: '0mm', sku_name: 'generic-Vbits-V90-T0.30' }
